<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Jokes</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      --background-color: #f5f5f5;
      --background-gradient: radial-gradient(circle at top, rgba(112, 147, 220, 0.2), transparent 65%);
      --card-background: rgba(255, 255, 255, 0.88);
      --card-border: rgba(15, 23, 42, 0.06);
      --card-shadow: 0 26px 52px -24px rgba(15, 23, 42, 0.28);
      --text-primary: #111827;
      --text-secondary: rgba(30, 41, 59, 0.68);
      --punchline-color: #334155;
      --accent: #3056d3;
      --accent-contrast: #ffffff;
      background-color: var(--background-color);
      color: var(--text-primary);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background-color: #101524;
        --background-gradient: radial-gradient(circle at top, rgba(72, 101, 216, 0.34), rgba(7, 13, 27, 0.92) 60%);
        --card-background: rgba(20, 27, 45, 0.92);
        --card-border: rgba(148, 163, 209, 0.08);
        --card-shadow: 0 30px 60px -30px rgba(0, 0, 0, 0.65);
        --text-primary: #e8ecff;
        --text-secondary: rgba(224, 230, 255, 0.72);
        --punchline-color: rgba(224, 230, 255, 0.86);
        --accent: #7084ff;
        --accent-contrast: #0b1020;
      }
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(20px, 6vw, 40px);
      background: var(--background-gradient);
      background-color: var(--background-color);
    }

    main {
      max-width: 720px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: clamp(24px, 4vw, 40px);
    }

    .card {
      background: var(--card-background);
      border-radius: 20px;
      border: 1px solid var(--card-border);
      box-shadow: var(--card-shadow);
      backdrop-filter: blur(14px);
      padding: clamp(28px, 6vw, 40px);
      display: flex;
      flex-direction: column;
      gap: 20px;
      min-height: 240px;
    }

    .card__content {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .category-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .category-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      background: rgba(48, 86, 211, 0.12);
      color: var(--accent);
    }

    @media (prefers-color-scheme: dark) {
      .category-pill {
        background: rgba(112, 132, 255, 0.18);
        color: #b8c1ff;
      }
    }

    .home-nav {
      display: flex;
      justify-content: flex-start;
    }

    .home-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid var(--accent);
      text-decoration: none;
      color: var(--accent);
      font-weight: 600;
      background: transparent;
      transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
    }

    .home-link span[aria-hidden="true"] {
      font-size: 1.2rem;
    }

    .home-link:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(48, 86, 211, 0.28);
      background: rgba(48, 86, 211, 0.1);
    }

    .home-link:focus-visible {
      outline: 2px solid rgba(112, 132, 255, 0.65);
      outline-offset: 3px;
      box-shadow: 0 0 0 3px rgba(112, 132, 255, 0.25);
    }

    #joke-setup {
      margin: 0;
      font-size: clamp(1.35rem, 2.4vw + 1rem, 2.2rem);
      line-height: 1.4;
      font-weight: 600;
    }

    #joke-punchline {
      margin: 0;
      font-size: clamp(1.1rem, 1.8vw + 0.8rem, 1.6rem);
      line-height: 1.5;
      color: var(--punchline-color);
      display: none;
    }

    #joke-punchline.is-visible {
      display: block;
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .controls__nav {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      width: 100%;
    }

    .controls__punchline {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .controls__category {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 12px 20px;
      font-size: 1rem;
      cursor: pointer;
      background: var(--accent);
      color: var(--accent-contrast);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      touch-action: manipulation;
    }

    button.secondary {
      background: transparent;
      color: var(--accent);
      border: 1px solid currentColor;
      box-shadow: none;
    }

    @media (prefers-color-scheme: dark) {
      button.secondary {
        color: #9ba9ff;
        border-color: rgba(155, 169, 255, 0.5);
        background: rgba(112, 132, 255, 0.12);
      }
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    button:not(:disabled):hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(48, 86, 211, 0.28);
    }

    button:focus-visible {
      outline: 2px solid rgba(112, 132, 255, 0.65);
      outline-offset: 3px;
    }

    .category-picker {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .category-picker select {
      border-radius: 999px;
      border: 1px solid rgba(15, 23, 42, 0.18);
      padding: 10px 18px;
      font-size: 1rem;
      background: rgba(255, 255, 255, 0.92);
      color: inherit;
      cursor: pointer;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      min-width: 200px;
    }

    .category-picker select:focus-visible {
      outline: 2px solid rgba(112, 132, 255, 0.6);
      outline-offset: 3px;
      box-shadow: 0 0 0 3px rgba(112, 132, 255, 0.22);
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (hover: none) and (pointer: coarse) {
      button:not(:disabled) {
        transition: none;
      }

      button:not(:disabled):hover,
      button:not(:disabled):active,
      button:not(:disabled):focus {
        transform: none;
        box-shadow: none;
      }
    }

    @media (prefers-color-scheme: dark) {
      .category-picker select {
        background: rgba(14, 20, 36, 0.9);
        border-color: rgba(148, 163, 209, 0.35);
        color: inherit;
      }
    }
  </style>
</head>
  <body>
  <main aria-label="Random jokes">
    <nav class="home-nav" aria-label="Home navigation">
      <a class="home-link" href="../../">
        <span aria-hidden="true">←</span>
        <span>Home</span>
      </a>
    </nav>
    <article class="card" aria-live="polite">
      <div class="card__content">
        <ul id="joke-categories" class="category-list" aria-label="Joke categories" hidden></ul>
        <p id="joke-setup">Loading joke…</p>
        <p id="joke-punchline" aria-hidden="true"></p>
      </div>
    </article>
    <div class="controls">
      <div class="controls__nav">
        <button id="prev-button" type="button" aria-label="Show previous joke">⟵ Previous</button>
        <button id="next-button" type="button" aria-label="Show next joke">Next ⟶</button>
      </div>
      <div class="controls__punchline">
        <button id="reveal-button" class="secondary" type="button" aria-pressed="false">Punchline</button>
      </div>
      <div class="controls__category">
        <label class="category-picker" for="category-select">
          <span class="visually-hidden">Select joke category</span>
          <select id="category-select" aria-label="Joke category" disabled></select>
        </label>
      </div>
    </div>
  </main>
  <script src="jokes.js" defer></script>
  <script src="joke-categories.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
