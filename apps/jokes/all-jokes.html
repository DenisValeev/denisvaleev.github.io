<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Jokes</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 32px 16px 48px;
      background-color: #f7f7f7;
      color: #202020;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #121212;
        color: #f1f5ff;
      }

      table {
        background: rgba(255, 255, 255, 0.04);
      }

      th,
      td,
      table {
        border-color: rgba(255, 255, 255, 0.2);
      }

      .punchline-row td {
        background: rgba(255, 255, 255, 0.08);
      }

      .home-link {
        border-color: rgba(241, 245, 255, 0.35);
        background: rgba(255, 255, 255, 0.08);
      }

      .home-link:hover {
        background: rgba(255, 255, 255, 0.14);
        box-shadow: 0 12px 24px rgba(15, 23, 42, 0.45);
      }

      .filter input[type="search"] {
        background: rgba(18, 18, 18, 0.9);
        border-color: rgba(241, 245, 255, 0.35);
        color: inherit;
      }

      .category-pill {
        background: rgba(148, 163, 209, 0.24);
        color: rgba(241, 245, 255, 0.9);
      }
    }

    main {
      max-width: 960px;
      margin: 0 auto;
    }

    .home-nav {
      display: flex;
      justify-content: flex-start;
      margin-bottom: 1.5rem;
    }

    .home-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid rgba(48, 86, 211, 0.4);
      text-decoration: none;
      color: inherit;
      font-weight: 600;
      background: rgba(48, 86, 211, 0.08);
      transition: background 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
    }

    .home-link span[aria-hidden="true"] {
      font-size: 1.2rem;
    }

    .home-link:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 24px rgba(48, 86, 211, 0.18);
      background: rgba(48, 86, 211, 0.14);
    }

    .home-link:focus-visible {
      outline: 2px solid rgba(48, 86, 211, 0.6);
      outline-offset: 3px;
      box-shadow: 0 0 0 3px rgba(48, 86, 211, 0.25);
    }

    h1 {
      margin-bottom: 0.25rem;
      font-size: clamp(1.8rem, 2vw + 1.2rem, 2.4rem);
    }

    p {
      margin: 0 0 1rem;
      line-height: 1.6;
    }

    .count {
      font-weight: 600;
    }

    .category-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 12px 0 0;
      padding: 0;
      list-style: none;
    }

    .category-pill {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      background: rgba(48, 86, 211, 0.12);
      color: rgba(48, 56, 140, 0.92);
    }

    .filter {
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .filter label {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .filter input[type="search"] {
      width: 100%;
      box-sizing: border-box;
      border-radius: 12px;
      border: 1px solid rgba(0, 0, 0, 0.2);
      background: rgba(255, 255, 255, 0.95);
      color: inherit;
      padding: 10px 14px;
      font: inherit;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .filter input[type="search"]:focus-visible {
      outline: 2px solid rgba(48, 86, 211, 0.55);
      outline-offset: 2px;
      box-shadow: 0 0 0 3px rgba(48, 86, 211, 0.18);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1.5rem;
      border: 1px solid rgba(0, 0, 0, 0.15);
      background: rgba(255, 255, 255, 0.9);
    }

    td {
      padding: 12px 14px;
      border: 1px solid rgba(0, 0, 0, 0.15);
      vertical-align: top;
      text-align: left;
    }

    .setup-cell,
    .punchline-cell {
      white-space: pre-wrap;
    }

    .punchline-row td {
      font-style: italic;
      background: rgba(48, 86, 211, 0.08);
    }

    caption {
      text-align: left;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }
  </style>
</head>
<body>
  <main>
    <nav class="home-nav" aria-label="Home navigation">
      <a class="home-link" href="../../">
        <span aria-hidden="true">←</span>
        <span>Home</span>
      </a>
    </nav>
    <h1>All Jokes</h1>
    <p>Every joke from the dataset in one place—complete with quick-hit categories. Use the filter to zero in on a favourite or explore a topic.</p>
    <p class="count">Showing <span data-count>0</span> of <span data-total>0</span> jokes</p>
    <form class="filter" data-filter-form>
      <label for="joke-filter">Filter jokes</label>
      <input id="joke-filter" type="search" name="joke-filter" placeholder="Type to filter…" autocomplete="off" data-filter-input>
    </form>
    <table>
      <caption>Setup followed by punchline</caption>
      <tbody>
        <tr>
          <td>Loading jokes…</td>
        </tr>
      </tbody>
    </table>
  </main>
  <script src="jokes.js" defer></script>
  <script src="joke-categories.js" defer></script>
  <script src="render-all.js" defer></script>
</body>
</html>
