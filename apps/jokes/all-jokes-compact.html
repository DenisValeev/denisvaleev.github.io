<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Jokes — Compact Table</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      --bg-color: #f6f7fb;
      --bg-gradient: radial-gradient(circle at top, rgba(120, 140, 220, 0.12), rgba(15, 23, 42, 0.05) 70%);
      --surface: rgba(255, 255, 255, 0.95);
      --surface-shadow: 0 30px 70px rgba(15, 23, 42, 0.14);
      --surface-border: rgba(15, 23, 42, 0.08);
      --text-primary: #0f172a;
      --text-secondary: rgba(15, 23, 42, 0.65);
      --table-header: rgba(15, 23, 42, 0.05);
      --table-stripe: rgba(15, 23, 42, 0.03);
      --table-border: rgba(15, 23, 42, 0.1);
      --badge-bg: rgba(74, 99, 255, 0.14);
      --category-pill-bg: rgba(74, 99, 255, 0.14);
      --category-pill-text: rgba(31, 50, 143, 0.92);
      background-color: var(--bg-color);
      color: var(--text-primary);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #0b1020;
        --bg-gradient: radial-gradient(circle at top, rgba(72, 101, 216, 0.28), rgba(9, 17, 35, 0.86) 65%);
        --surface: rgba(14, 20, 36, 0.92);
        --surface-shadow: 0 32px 80px rgba(0, 0, 0, 0.45);
        --surface-border: rgba(148, 163, 209, 0.08);
        --text-primary: #f1f5ff;
        --text-secondary: rgba(209, 216, 255, 0.7);
        --table-header: rgba(105, 128, 255, 0.18);
        --table-stripe: rgba(255, 255, 255, 0.04);
        --table-border: rgba(148, 163, 209, 0.12);
        --badge-bg: rgba(105, 128, 255, 0.16);
        --category-pill-bg: rgba(105, 128, 255, 0.18);
        --category-pill-text: rgba(225, 232, 255, 0.92);
      }

      .filter input[type="search"] {
        background: rgba(14, 20, 36, 0.9);
        border-color: rgba(148, 163, 209, 0.4);
        color: inherit;
      }

      .filter select {
        background: rgba(14, 20, 36, 0.9);
        border-color: rgba(148, 163, 209, 0.4);
        color: inherit;
      }

      .home-link {
        border-color: rgba(148, 163, 209, 0.45);
        background: rgba(148, 163, 209, 0.18);
      }

      .home-link:hover {
        background: rgba(148, 163, 209, 0.26);
        box-shadow: 0 14px 28px rgba(2, 6, 23, 0.45);
      }
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: clamp(24px, 5vw, 48px);
      background: var(--bg-gradient);
      background-color: var(--bg-color);
    }

    main {
      width: min(1040px, 100%);
      background: var(--surface);
      border-radius: 24px;
      box-shadow: var(--surface-shadow);
      border: 1px solid var(--surface-border);
      padding: clamp(28px, 4vw, 48px);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    header.page-header {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .home-nav {
      display: flex;
      justify-content: flex-start;
    }

    .home-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid rgba(74, 99, 255, 0.35);
      text-decoration: none;
      color: inherit;
      font-weight: 600;
      background: rgba(74, 99, 255, 0.12);
      transition: background 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
    }

    .home-link span[aria-hidden="true"] {
      font-size: 1.2rem;
    }

    .home-link:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 28px rgba(15, 23, 42, 0.22);
      background: rgba(74, 99, 255, 0.18);
    }

    .home-link:focus-visible {
      outline: 2px solid rgba(112, 132, 255, 0.6);
      outline-offset: 3px;
      box-shadow: 0 0 0 3px rgba(112, 132, 255, 0.28);
    }

    header.page-header h1 {
      margin: 0;
      font-size: clamp(1.8rem, 2vw + 1.4rem, 2.6rem);
      font-weight: 700;
    }

    header.page-header p {
      margin: 0;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--badge-bg);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      color: inherit;
    }

    .category-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .category-pill {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      background: var(--category-pill-bg);
      color: var(--category-pill-text);
    }

    .filter {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 4px;
    }

    .filter label {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-secondary);
    }

    .filter input[type="search"] {
      width: 100%;
      box-sizing: border-box;
      border-radius: 14px;
      border: 1px solid var(--table-border);
      background: rgba(255, 255, 255, 0.92);
      color: inherit;
      padding: 12px 16px;
      font: inherit;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .filter input[type="search"]:focus-visible {
      outline: 2px solid rgba(112, 132, 255, 0.5);
      outline-offset: 2px;
      box-shadow: 0 0 0 3px rgba(112, 132, 255, 0.18);
    }

    .filter select {
      width: 100%;
      box-sizing: border-box;
      border-radius: 14px;
      border: 1px solid var(--table-border);
      background: rgba(255, 255, 255, 0.92);
      color: inherit;
      padding: 12px 16px;
      font: inherit;
      cursor: pointer;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .filter select:focus-visible {
      outline: 2px solid rgba(112, 132, 255, 0.5);
      outline-offset: 2px;
      box-shadow: 0 0 0 3px rgba(112, 132, 255, 0.18);
    }

    .table-wrapper {
      border: 1px solid var(--table-border);
      border-radius: 16px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.02);
      max-height: 85vh;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 640px;
    }

    thead th {
      position: sticky;
      top: 0;
      background: var(--table-header);
      backdrop-filter: blur(6px);
      text-align: left;
      padding: 12px 14px;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    tbody tr:nth-child(even) {
      background: var(--table-stripe);
    }

    th,
    td {
      padding: 10px 14px;
      vertical-align: top;
      border-bottom: 1px solid var(--table-border);
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.92rem;
      line-height: 1.45;
    }

    th[scope="row"] {
      width: 52px;
      font-weight: 600;
      text-align: right;
    }

    tbody tr:last-child th,
    tbody tr:last-child td {
      border-bottom: none;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    body.is-compact th,
    body.is-compact td {
      padding: 8px 10px;
      font-size: 0.85rem;
    }

    body.is-compact thead th {
      padding: 8px 10px;
      font-size: 0.72rem;
    }

    @media (max-width: 720px) {
      main {
        padding: clamp(20px, 6vw, 32px);
      }

      table {
        min-width: 100%;
      }
    }
  </style>
</head>
<body data-compact="true">
  <main>
    <nav class="home-nav" aria-label="Home navigation">
      <a class="home-link" href="../../">
        <span aria-hidden="true">←</span>
        <span>Home</span>
      </a>
    </nav>
    <header class="page-header">
      <h1>All Jokes (Compact)</h1>
      <p>Condensed view with tighter spacing for quicker scanning. <span class="badge">Showing <span data-count>0</span> of <span data-total>0</span> jokes</span></p>
    </header>
    <form class="filter" data-filter-form>
      <label for="compact-joke-filter">Filter jokes</label>
      <input id="compact-joke-filter" type="search" name="compact-joke-filter" placeholder="Type to filter…" autocomplete="off" data-filter-input>
      <label for="compact-joke-category-select">Filter by category</label>
      <select id="compact-joke-category-select" name="compact-joke-category-select" data-category-select aria-label="Joke category" disabled>
        <option>Loading categories…</option>
      </select>
    </form>
    <div class="table-wrapper" role="region" aria-live="polite">
      <table>
        <caption class="sr-only">Compact list of jokes with punchlines</caption>
        <thead>
          <tr>
            <th scope="col">#</th>
            <th scope="col">Joke</th>
            <th scope="col">Punchline</th>
            <th scope="col">Categories</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td colspan="4">Loading jokes…</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
  <script src="jokes.js" defer></script>
  <script src="joke-categories.js" defer></script>
  <script src="render-all.js" defer></script>
</body>
</html>
