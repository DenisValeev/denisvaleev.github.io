<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quotes</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      background-color: #f5f5f5;
      color: #1f1f1f;
      --quote-author-color: rgba(31, 31, 31, 0.6);
      --quote-author-font: "Georgia", "Times New Roman", serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        background-color: #1f1f1f;
        color: #f5f5f5;
        --quote-author-color: rgba(245, 245, 245, 0.7);
      }

      .category-picker select {
        background: rgba(32, 32, 32, 0.85);
        border-color: rgba(255, 255, 255, 0.35);
      }
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: radial-gradient(circle at top, rgba(88, 140, 200, 0.25), transparent 60%);
    }

    main {
      max-width: 720px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .card {
      background: rgba(255, 255, 255, 0.85);
      color: inherit;
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 24px 48px -24px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(12px);
      min-height: 200px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 18px;
    }

    .card blockquote {
      margin: 0;
      font-size: clamp(1.25rem, 2.2vw + 1rem, 2rem);
      line-height: 1.45;
      font-weight: 500;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .card blockquote p {
      margin: 0;
    }

    .quote-meta {
      font-family: var(--quote-author-font);
      color: var(--quote-author-color);
      text-align: right;
      font-size: clamp(0.95rem, 0.8vw + 0.8rem, 1.1rem);
      letter-spacing: 0.01em;
      align-self: flex-end;
    }

    .quote-meta::before {
      content: '— ';
    }

    .quote-meta cite {
      font-style: normal;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .category-picker {
      position: relative;
      display: flex;
      align-items: center;
    }

    .category-picker select {
      border-radius: 999px;
      border: 1px solid rgba(0, 0, 0, 0.18);
      padding: 10px 18px;
      font-size: 1rem;
      background: rgba(255, 255, 255, 0.9);
      color: inherit;
      cursor: pointer;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      min-width: 180px;
    }

    .category-picker select:focus-visible {
      outline: 2px solid rgba(48, 86, 211, 0.6);
      outline-offset: 3px;
      box-shadow: 0 0 0 3px rgba(48, 86, 211, 0.25);
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 12px 20px;
      font-size: 1rem;
      cursor: pointer;
      background: #3056d3;
      color: #ffffff;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      touch-action: manipulation;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    button:not(:disabled):hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(48, 86, 211, 0.35);
    }

    button:focus-visible {
      outline: 2px solid rgba(48, 86, 211, 0.6);
      outline-offset: 3px;
    }

    @media (hover: none) and (pointer: coarse) {
      button:not(:disabled) {
        transition: none;
      }

      button:not(:disabled):hover,
      button:not(:disabled):active,
      button:not(:disabled):focus {
        transform: none;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <main aria-label="Quotes">
    <div class="card" role="group" aria-live="polite">
      <blockquote>
        <p id="quote-text">Loading quote…</p>
        <footer class="quote-meta" id="quote-meta" hidden>
          <cite id="quote-author"></cite>
        </footer>
      </blockquote>
    </div>
    <div class="controls">
      <button id="prev-button" type="button" aria-label="Show previous quote">⟵ Previous</button>
      <button id="next-button" type="button" aria-label="Show next quote">Next ⟶</button>
      <label class="category-picker" for="category-select">
        <span class="visually-hidden">Select quote category</span>
        <select id="category-select" aria-label="Quote category"></select>
      </label>
    </div>
  </main>
  <script src="quotes-data.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
