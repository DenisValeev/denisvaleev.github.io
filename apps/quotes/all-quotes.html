<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Quotes</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      --author-font: "Georgia", "Times New Roman", serif;
      --author-color: rgba(32, 32, 32, 0.65);
      --meta-background: rgba(48, 86, 211, 0.08);
    }

    body {
      margin: 0;
      padding: 32px 16px 48px;
      background-color: #f7f7f7;
      color: #202020;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #121212;
        color: #f1f5ff;
      }

      :root {
        --author-color: rgba(241, 245, 255, 0.7);
        --meta-background: rgba(255, 255, 255, 0.08);
      }

      table {
        background: rgba(255, 255, 255, 0.04);
      }

      td,
      table {
        border-color: rgba(255, 255, 255, 0.2);
      }
    }

    main {
      max-width: 960px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 0.25rem;
      font-size: clamp(1.8rem, 2vw + 1.2rem, 2.4rem);
    }

    p {
      margin: 0 0 1rem;
      line-height: 1.6;
    }

    .count {
      font-weight: 600;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1.5rem;
      border: 1px solid rgba(0, 0, 0, 0.15);
      background: rgba(255, 255, 255, 0.9);
    }

    td {
      padding: 12px 14px;
      border: 1px solid rgba(0, 0, 0, 0.15);
      vertical-align: top;
      text-align: left;
    }

    .quote-cell {
      white-space: pre-wrap;
      line-height: 1.55;
    }

    .meta-row td {
      font-family: var(--author-font);
      color: var(--author-color);
      text-align: right;
      background: var(--meta-background);
      font-size: 0.95rem;
      letter-spacing: 0.01em;
    }

    .meta-author {
      font-style: normal;
      font-weight: 600;
    }

    .meta-category {
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.75;
    }

    caption {
      text-align: left;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>All Quotes</h1>
    <p>Flip through every quote across the themed decks in one place.</p>
    <p class="count"><span data-count>0</span> quotes</p>
    <table>
      <caption>Quote followed by author and category</caption>
      <tbody>
        <tr>
          <td>Loading quotes…</td>
        </tr>
      </tbody>
    </table>
  </main>
  <script src="quotes-data.js" defer></script>
  <script src="render-all.js" defer></script>
</body>
</html>
