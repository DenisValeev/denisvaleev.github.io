<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Quotes</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      --author-font: "Georgia", "Times New Roman", serif;
      --author-color: rgba(32, 32, 32, 0.65);
      --meta-background: rgba(48, 86, 211, 0.08);
    }

    body {
      margin: 0;
      padding: 32px 16px 48px;
      background-color: #f7f7f7;
      color: #202020;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #121212;
        color: #f1f5ff;
      }

      :root {
        --author-color: rgba(241, 245, 255, 0.7);
        --meta-background: rgba(255, 255, 255, 0.08);
      }

      table {
        background: rgba(255, 255, 255, 0.04);
      }

      td,
      table {
        border-color: rgba(255, 255, 255, 0.2);
      }

      .home-link {
        border-color: rgba(241, 245, 255, 0.35);
        background: rgba(255, 255, 255, 0.08);
      }

      .home-link:hover {
        background: rgba(255, 255, 255, 0.14);
        box-shadow: 0 12px 24px rgba(15, 23, 42, 0.45);
      }

      .filter input[type="search"] {
        background: rgba(18, 18, 18, 0.9);
        border-color: rgba(241, 245, 255, 0.35);
        color: inherit;
      }

      .category-picker select {
        background: rgba(18, 18, 18, 0.9);
        border-color: rgba(241, 245, 255, 0.35);
        color: inherit;
      }
    }

    main {
      max-width: 960px;
      margin: 0 auto;
    }

    .home-nav {
      display: flex;
      justify-content: flex-start;
      margin-bottom: 1.5rem;
    }

    .home-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid rgba(48, 86, 211, 0.4);
      text-decoration: none;
      color: inherit;
      font-weight: 600;
      background: rgba(48, 86, 211, 0.08);
      transition: background 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
    }

    .home-link span[aria-hidden="true"] {
      font-size: 1.2rem;
    }

    .home-link:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 24px rgba(48, 86, 211, 0.18);
      background: rgba(48, 86, 211, 0.14);
    }

    .home-link:focus-visible {
      outline: 2px solid rgba(48, 86, 211, 0.6);
      outline-offset: 3px;
      box-shadow: 0 0 0 3px rgba(48, 86, 211, 0.25);
    }

    h1 {
      margin-bottom: 0.25rem;
      font-size: clamp(1.8rem, 2vw + 1.2rem, 2.4rem);
    }

    p {
      margin: 0 0 1rem;
      line-height: 1.6;
    }

    .count {
      font-weight: 600;
    }

    .filters {
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    @media (min-width: 720px) {
      .filters {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }

    .category-picker {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .category-picker select {
      border-radius: 999px;
      border: 1px solid rgba(48, 86, 211, 0.32);
      padding: 10px 18px;
      font: inherit;
      background: rgba(255, 255, 255, 0.95);
      color: inherit;
      cursor: pointer;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      min-width: 220px;
    }

    .category-picker select:focus-visible {
      outline: 2px solid rgba(48, 86, 211, 0.55);
      outline-offset: 3px;
      box-shadow: 0 0 0 3px rgba(48, 86, 211, 0.18);
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .filter {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      flex: 1;
    }

    .filter label {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .filter input[type="search"] {
      width: 100%;
      box-sizing: border-box;
      border-radius: 12px;
      border: 1px solid rgba(0, 0, 0, 0.2);
      background: rgba(255, 255, 255, 0.95);
      color: inherit;
      padding: 10px 14px;
      font: inherit;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .filter input[type="search"]:focus-visible {
      outline: 2px solid rgba(48, 86, 211, 0.55);
      outline-offset: 2px;
      box-shadow: 0 0 0 3px rgba(48, 86, 211, 0.18);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1.5rem;
      border: 1px solid rgba(0, 0, 0, 0.15);
      background: rgba(255, 255, 255, 0.9);
    }

    td {
      padding: 12px 14px;
      border: 1px solid rgba(0, 0, 0, 0.15);
      vertical-align: top;
      text-align: left;
    }

    .quote-cell {
      white-space: pre-wrap;
      line-height: 1.55;
    }

    .meta-row td {
      font-family: var(--author-font);
      color: var(--author-color);
      text-align: right;
      background: var(--meta-background);
      font-size: 0.95rem;
      letter-spacing: 0.01em;
    }

    .meta-author {
      font-style: normal;
      font-weight: 600;
    }

    .meta-category {
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.75;
    }

    caption {
      text-align: left;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }
  </style>
</head>
<body>
  <main>
    <nav class="home-nav" aria-label="Home navigation">
      <a class="home-link" href="../../">
        <span aria-hidden="true">←</span>
        <span>Home</span>
      </a>
    </nav>
    <h1>All Quotes</h1>
    <p>Flip through every quote across the themed decks in one place.</p>
    <p class="count">Showing <span data-count>0</span> of <span data-total>0</span> quotes</p>
    <div class="filters">
      <label class="category-picker" for="quote-category">
        <span class="visually-hidden">Select quote category</span>
        <select id="quote-category" aria-label="Quote category" data-category-select></select>
      </label>
      <form class="filter" data-filter-form>
        <label for="quote-filter">Filter quotes</label>
        <input id="quote-filter" type="search" name="quote-filter" placeholder="Type to filter…" autocomplete="off" data-filter-input>
      </form>
    </div>
    <table>
      <caption>Quote followed by author and category</caption>
      <tbody>
        <tr>
          <td>Loading quotes…</td>
        </tr>
      </tbody>
    </table>
  </main>
  <script src="quotes-data.js" defer></script>
  <script src="render-all.js" defer></script>
</body>
</html>
