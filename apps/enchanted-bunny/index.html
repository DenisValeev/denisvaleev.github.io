      function beginButterflyTarget(butterfly, time) {
        butterfly.status = "targeting";
        butterfly.targetStart = time;
        butterfly.targetDuration = reducedMotion ? 320 : 520;
        butterfly.lockX = butterfly.currentX;
        butterfly.lockY = butterfly.currentY;
        butterfly.lockRotation = butterfly.rotation;
        butterfly.lockScale = butterfly.currentScale || butterfly.scale;
        butterfly.element.disabled = true;
        butterfly.element.classList.remove("is-bursting");
        butterfly.element.classList.add("is-targeted");
        setButterflySparkle(butterfly, 0, 0);
        collection.active = butterfly;
        collection.kind = "butterfly";
        collection.phase = "butterfly-target";
        collection.progress = 0;
        collection.beamVisible = true;
        collection.focusSpace = "scene";
        collection.focusStrength = 0.8;
        const focus = butterflyFocusScene(butterfly);
        collection.focusSceneX = focus.x;
        collection.focusSceneY = focus.y;
        sparkle = 1;
        forceBlink(time);
      }

      function startButterflyBurst(butterfly, time) {
        butterfly.status = "burst";
        butterfly.burstStart = time;
        butterfly.burstDuration = reducedMotion ? 260 : 460;
        butterfly.respawnAt = time + butterfly.burstDuration + (reducedMotion ? 220 : 520);
        butterfly.element.classList.remove("is-targeted");
        butterfly.element.classList.add("is-bursting");
        collection.active = butterfly;
        collection.kind = "butterfly";
        collection.phase = "butterfly-burst";
        collection.progress = 0;
        collection.beamVisible = false;
        collection.focusSpace = "scene";
        collection.focusStrength = 0.32;
        clearBeams();
        sparkle = 1;
        forceBlink(time);
      }

      function finishButterflyTarget(butterfly) {
        butterfly.element.classList.remove("is-targeted", "is-bursting");
        butterfly.element.style.opacity = "0";
        setButterflySparkle(butterfly, 0, 0);
        collection.active = null;
        collection.kind = null;
        collection.phase = "idle";
        collection.progress = 0;
        collection.beamVisible = false;
        collection.focusSpace = "clearing";
        collection.focusStrength = 0;
      }

      function respawnButterfly(butterfly, time) {
        applyButterflyPath(butterfly, chooseButterflyPath(butterfly));
        butterfly.status = "revealing";
        butterfly.revealStart = time;
        butterfly.revealDuration = reducedMotion ? 220 : 420;
        butterfly.element.disabled = true;
        butterfly.element.classList.remove("is-targeted", "is-bursting");
        setButterflySparkle(butterfly, 0, 0);
      }

      function updateBasketMotion(time) {
        let lift = 0;
        let tilt = 0;
        let pulse = 1;

        if (basketReset.active) {
          const raw = clamp((time - basketReset.start) / basketReset.duration, 0, 1);
          const hop = Math.sin(raw * Math.PI);
          const wobble = Math.sin(raw * Math.PI * 2.2) * (1 - raw);
          lift = -hop * (reducedMotion ? 5 : 13);
          tilt = wobble * (reducedMotion ? 1.6 : 4.6);
          pulse = 1 + hop * (reducedMotion ? 0.02 : 0.05);

          if (!basketReset.released && basketReset.pending.length && time >= basketReset.releaseAt) {
            const releaseSpawns = chooseCarrotReleaseSpawns(basketReset.pending);
            basketReset.pending.forEach((state, index) => {
              beginCarrotRelease(state, releaseSpawns[index], time, index);
            });
            basketReset.pending = [];
            basketReset.released = true;
          }

          if (raw >= 1) {
            basketReset.active = false;
            basketReset.pending = [];
            basketReset.released = true;
          }
        }

        [basket, basketFront, basketRim].forEach((element) => {
          if (!element) {
            return;
          }

          element.style.setProperty("--basket-shift-y", lift.toFixed(2) + "px");
          element.style.setProperty("--basket-tilt", tilt.toFixed(2) + "deg");
          element.style.setProperty("--basket-pulse", pulse.toFixed(3));
        });
      }

      function triggerBasketReset() {
        if (interactionsLocked()) {
          return;
        }

        const tucked = carrotStates.filter((state) => state.phase === "collected");
        const now = performance.now();
        basketReset.active = true;
        basketReset.start = now;
        basketReset.duration = reducedMotion ? 320 : 620;
        basketReset.releaseAt = now + (reducedMotion ? 80 : 150);
        basketReset.released = tucked.length === 0;
        basketReset.pending = tucked.slice();
        collection.queue = [];
        sparkle = 1;
      }

      function clearBeams() {
        beamSvg.classList.remove("is-active");
        beamPaths.forEach(({ glow, core }) => {
          glow.setAttribute("d", "");
          core.setAttribute("d", "");
        });
        beamSpark.style.opacity = "0";
        beamSpark.setAttribute("r", "0");
      }

      function dequeueNextCarrot(time) {
        if (collection.active || basketReset.active || hasCarrotReleaseInFlight()) {
          return;
        }

        while (collection.queue.length) {
          const next = collection.queue.shift();
          if (next && next.phase === "queued") {
            beginCollection(next, time);
            break;
          }
        }
      }

      function beginCollection(state, time) {
        const previousPhase = state.phase;
        collection.queue = collection.queue.filter((item) => item !== state);

        state.phase = "transport";
        state.progress = 0;
        state.start = time;
        state.fromX = previousPhase === "queued" ? state.originX : state.x || state.originX;
        state.fromY = previousPhase === "queued" ? state.originY : state.y || state.originY;
        state.fromRotation = state.baseRotation;
        state.fromScale = state.baseScale;
        state.x = state.fromX;
        state.y = state.fromY;
        state.rotation = state.baseRotation;
        state.scale = state.baseScale;
        state.transportDuration = reducedMotion ? 700 : 1180;
        state.dropDuration = reducedMotion ? 180 : 320;
        state.bounceDuration = reducedMotion ? 260 : 580;
        syncCarrotTargets(state);

        state.element.classList.remove("is-triggered", "is-queued", "is-dropping", "is-collected", "is-releasing");
        state.element.classList.add("is-collecting");
        state.element.setAttribute("aria-disabled", "true");

        collection.active = state;
        collection.kind = "carrot";
        collection.phase = "transport";
        collection.progress = 0;
        collection.beamVisible = true;
        collection.focusSpace = "clearing";
        collection.focusStrength = 0.72;
        const focus = carrotFocusPoint(state);
        collection.focusLocalX = focus.x;
        collection.focusLocalY = focus.y;
        sparkle = 1;
      }

      function finishCollection(state, time) {
        state.phase = "collected";
        state.progress = 1;
        state.x = state.slotX;
        state.y = state.slotY;
        state.rotation = state.slotRotation;
        state.scale = state.slotScale;
        renderCarrot(state);

        state.element.classList.remove("is-collecting", "is-dropping", "is-queued", "is-releasing");
        state.element.classList.add("is-collected");
        state.element.setAttribute("aria-label", state.defaultLabel + " — now tucked into the basket");
        state.element.setAttribute("aria-disabled", "true");
        state.element.tabIndex = -1;
        if (document.activeElement === state.element) {
          state.element.blur();
        }

        collection.active = null;
        collection.kind = null;
        collection.phase = "idle";
        collection.progress = 0;
        collection.focusStrength = 0;
        collection.beamVisible = false;
        collection.focusSpace = "clearing";
        dequeueNextCarrot(time);
      }

      function updateTransportPhase(state, time) {
        const raw = clamp((time - state.start) / state.transportDuration, 0, 1);
        const eased = reducedMotion ? raw : easeInOutCubic(raw);
        const arcWave = Math.sin(raw * Math.PI);

        state.progress = raw;
        state.x = lerp(state.fromX, state.approachX, eased) + arcWave * state.arcSway;
        state.y = lerp(state.fromY, state.approachY, eased) - arcWave * state.arcHeight;
        state.rotation = lerp(state.baseRotation, state.slotRotation * 0.56, eased) + Math.sin(raw * Math.PI * 2.2) * (reducedMotion ? 1.4 : 3.6);
        state.scale = state.baseScale * (1 + arcWave * (reducedMotion ? 0.016 : 0.05));

        const focus = carrotFocusPoint(state, state.focusHeight || 0.36);
        collection.phase = "transport";
        collection.progress = raw;
        collection.beamVisible = true;
        collection.focusStrength = 0.58 + arcWave * 0.42;
        collection.focusLocalX = focus.x;
        collection.focusLocalY = focus.y;

        renderCarrot(state);

        if (raw >= 1) {
          state.phase = "drop";
          state.progress = 0;
          state.start = time;
          state.fromX = state.x;
          state.fromY = state.y;
          state.fromRotation = state.rotation;
          state.fromScale = state.scale;
          state.element.classList.remove("is-collecting");
          state.element.classList.add("is-dropping");
          collection.beamVisible = false;
          clearBeams();
          forceBlink(time);
        }
      }

      function updateDropPhase(state, time) {
        const raw = clamp((time - state.start) / state.dropDuration, 0, 1);
        const settle = reducedMotion ? raw : easeOutCubic(raw);
        const fall = reducedMotion ? raw : easeInQuad(raw);
        const squash = reducedMotion ? 0 : Math.sin(raw * Math.PI) * 0.08;

        state.progress = raw;
        state.x = lerp(state.fromX, state.slotX, settle);
        state.y = lerp(state.fromY, state.slotY, fall);
        state.rotation = lerp(state.fromRotation, state.slotRotation, settle);
        state.scale = lerp(state.fromScale, state.slotScale, raw) * (1 - squash * 0.45);

        collection.phase = "drop";
        collection.progress = raw;
        collection.beamVisible = false;
        collection.focusStrength = 0.32 * (1 - raw) + 0.08;
        collection.focusLocalX = basketState.x;
        collection.focusLocalY = basketState.y - basketState.height * 0.14;

        renderCarrot(state);

        if (raw >= 1) {
          state.phase = "bounce";
          state.progress = 0;
          state.start = time;
          state.x = state.slotX;
          state.y = state.slotY;
          state.rotation = state.slotRotation;
          state.scale = state.slotScale;
          renderCarrot(state);
        }
      }

      function updateBouncePhase(state, time) {
        const raw = clamp((time - state.start) / state.bounceDuration, 0, 1);
        const bounce = reducedMotion ? 0 : Math.sin(raw * Math.PI * 1.8) * (1 - raw) * 14;
        const squash = reducedMotion ? 0 : Math.sin(raw * Math.PI) * 0.1;

        state.progress = raw;
        state.x = state.slotX;
        state.y = state.slotY - Math.max(0, bounce);
        state.rotation = state.slotRotation + Math.sin(raw * Math.PI * 1.6) * (1 - raw) * 2.6;
        state.scale = state.slotScale * (1 - squash * 0.42);

        collection.phase = "bounce";
        collection.progress = raw;
        collection.beamVisible = false;
        collection.focusStrength = 0.14 * (1 - raw);
        collection.focusLocalX = basketState.x;
        collection.focusLocalY = basketState.y - basketState.height * 0.08;

        renderCarrot(state);

        if (raw >= 1) {
          finishCollection(state, time);
        }
      }

      function updateCollection(time) {
        if (collection.kind && collection.kind !== "carrot") {
          return;
        }

        if (!collection.active) {
          collection.kind = null;
          collection.phase = "idle";
          collection.progress = 0;
          collection.focusStrength = 0;
          collection.beamVisible = false;
          collection.focusSpace = "clearing";
          dequeueNextCarrot(time);
          return;
        }

        const state = collection.active;
        syncCarrotTargets(state);

        if (state.phase === "transport") {
          updateTransportPhase(state, time);
        } else if (state.phase === "drop") {
          updateDropPhase(state, time);
        } else if (state.phase === "bounce") {
          updateBouncePhase(state, time);
        }
      }

      function updateLayout() {
        const sceneRect = scene.getBoundingClientRect();
        sceneLeft = sceneRect.left;
        sceneTop = sceneRect.top;
        width = sceneRect.width || window.innerWidth;
        height = sceneRect.height || window.innerHeight;
        pixelRatio = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = Math.round(width * pixelRatio);
        canvas.height = Math.round(height * pixelRatio);
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";
        ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

        const bunnyRect = bunnyCluster.getBoundingClientRect();
        bunnyAnchor.x = bunnyRect.left - sceneLeft + bunnyRect.width * 0.5;
        bunnyAnchor.y = bunnyRect.top - sceneTop + bunnyRect.height * 0.58;

        const clearingRect = clearing.getBoundingClientRect();
        clearingWidth = clearingRect.width || clearing.clientWidth;
        clearingHeight = clearingRect.height || clearing.clientHeight;
        beamSvg.setAttribute("viewBox", "0 0 " + Math.max(1, clearingWidth).toFixed(2) + " " + Math.max(1, clearingHeight).toFixed(2));

        const pocketRect = basketPocket.getBoundingClientRect();
        basketState.x = pocketRect.left - clearingRect.left + pocketRect.width * 0.5;
        basketState.y = pocketRect.top - clearingRect.top + pocketRect.height * 0.58;
        basketState.lipX = pocketRect.left - clearingRect.left + pocketRect.width * 0.5;
        basketState.lipY = pocketRect.top - clearingRect.top + pocketRect.height * 0.2;
        basketState.width = pocketRect.width;
        basketState.height = pocketRect.height;

        carrotStates.forEach((state) => {
          const previousOriginX = state.originX;
          const previousOriginY = state.originY;

          applyCarrotSpawnStyle(state);
          state.originX = state.element.offsetLeft;
          state.originY = state.element.offsetTop;
          state.width = state.element.offsetWidth;
          state.height = state.element.offsetHeight;
          syncCarrotTargets(state);

          if (state.phase === "idle" || state.phase === "queued") {
            state.x = state.originX;
            state.y = state.originY;
            state.rotation = state.baseRotation;
            state.scale = state.baseScale;
          } else if (state.phase === "collected") {
            state.x = state.slotX;
            state.y = state.slotY;
            state.rotation = state.slotRotation;
            state.scale = state.slotScale;
          } else if (previousOriginX || previousOriginY) {
            state.x += state.originX - previousOriginX;
            state.y += state.originY - previousOriginY;
          }

          renderCarrot(state);
        });

        settlePointer();
        rebuildParticles();
        clearBeams();
      }

      function triggerReaction(mode, carrot) {
        const state = carrotMap.get(carrot);
        if ((state && state.phase !== "idle") || interactionsLocked()) {
          return;
        }

        const now = performance.now();
        const rect = carrot.getBoundingClientRect();

        reaction.mode = mode;
        reaction.start = now;
        reaction.duration = mode === "hop" ? 1180 : mode === "glance" ? 980 : 900;
        reaction.focusX = rect.left - sceneLeft + rect.width * 0.5;
        reaction.focusY = rect.top - sceneTop + rect.height * ((state && state.focusHeight) || 0.38);

        carrot.classList.remove("is-triggered");
        void carrot.offsetWidth;
        carrot.classList.add("is-triggered");
        sparkle = 1;
      }

      function activateCarrot(state) {
        if (
          !state ||
          state.phase === "collected" ||
          state.phase === "transport" ||
          state.phase === "drop" ||
          state.phase === "bounce" ||
          state.phase === "release"
        ) {
          return;
        }

        const now = performance.now();

        if (basketReset.active || hasCarrotReleaseInFlight() || collection.kind === "butterfly") {
          return;
        }

        if (collection.active && collection.active !== state) {
          if (state.phase !== "queued") {
            state.phase = "queued";
            state.progress = 0;
            state.element.classList.remove("is-triggered");
            state.element.classList.add("is-queued");
            collection.queue.push(state);
            sparkle = 1;
          }
          return;
        }

        beginCollection(state, now);
      }

      carrots.forEach((carrot) => {
        const state = carrotMap.get(carrot);
        const reactionType = carrot.dataset.reaction || "perk";

        carrot.addEventListener("pointerenter", () => {
          if (!state || state.phase !== "idle" || interactionsLocked()) {
            return;
          }

          triggerReaction(reactionType, carrot);
        });

        carrot.addEventListener("click", (event) => {
          event.preventDefault();
          activateCarrot(state);
        });

        carrot.addEventListener("animationend", () => {
          if (state.phase === "idle" || state.phase === "queued") {
            carrot.classList.remove("is-triggered");
          }
        });
      });

      butterflies.forEach((butterfly) => {
        butterfly.element.addEventListener("click", (event) => {
          event.preventDefault();

          if (butterfly.status !== "idle" || interactionsLocked()) {
            return;
          }

          beginButterflyTarget(butterfly, performance.now());
        });
      });

      basket.addEventListener("click", (event) => {
        event.preventDefault();
        triggerBasketReset();
      });

      window.addEventListener(
        "pointermove",
        (event) => {
          setPointer(event.clientX, event.clientY, true);
        },
        { passive: true }
      );

      window.addEventListener(
        "pointerdown",
        (event) => {
          setPointer(event.clientX, event.clientY, true);
          sparkle = 1;
        },
        { passive: true }
      );

      scene.addEventListener("pointerleave", () => {
        pointer.active = false;
        settlePointer();
      });

      window.addEventListener(
        "resize",
        () => {
          updateLayout();
        },
        { passive: true }
      );

      const updateMotionPreferences = (event) => {
        reducedMotion = event.matches;
        updateLayout();
      };

      const updatePointerPreferences = (event) => {
        coarsePointer = event.matches;
      };

      if (typeof reducedMotionQuery.addEventListener === "function") {
        reducedMotionQuery.addEventListener("change", updateMotionPreferences);
        coarsePointerQuery.addEventListener("change", updatePointerPreferences);
      } else {
        reducedMotionQuery.addListener(updateMotionPreferences);
        coarsePointerQuery.addListener(updatePointerPreferences);
      }

      carrotStates.forEach((state) => {
        const templateId = initialCarrotSpawnIds[state.element.id];
        const template = carrotSpawnTemplates.find((item) => item.id === templateId) || carrotSpawnTemplates[state.slotIndex % carrotSpawnTemplates.length];
        state.spawn = createCarrotSpawn(template);
        state.spawnTemplateId = state.spawn.templateId;
        state.element.tabIndex = 0;
      });

      butterflies.forEach((butterfly) => {
        butterfly.element.disabled = false;
        setButterflySparkle(butterfly, 0, 0);
      });

      updateLayout();
      scheduleBlink(performance.now() - 1200);
      earTwitch.left.next = performance.now() + rand(1000, 2600);
      earTwitch.right.next = performance.now() + rand(1700, 3200);
      idleAttention.next = performance.now() + rand(900, 2200);

      function drawParticles(time, dt, nx, ny) {
        ctx.clearRect(0, 0, width, height);
        ctx.save();
        ctx.globalCompositeOperation = "screen";

        const glowRadius = reducedMotion ? 110 : 150 + sparkle * 28;
        const glow = ctx.createRadialGradient(pointer.x, pointer.y, 0, pointer.x, pointer.y, glowRadius);
        glow.addColorStop(0, "rgba(255, 236, 190, " + (0.14 + sparkle * 0.18) + ")");
        glow.addColorStop(0.32, "rgba(255, 209, 140, " + (0.08 + sparkle * 0.08) + ")");
        glow.addColorStop(1, "rgba(255, 209, 140, 0)");
        ctx.fillStyle = glow;
        ctx.fillRect(pointer.x - glowRadius, pointer.y - glowRadius, glowRadius * 2, glowRadius * 2);

        const halo = ctx.createRadialGradient(
          pointer.x - nx * 24,
          pointer.y - ny * 18,
          0,
          pointer.x - nx * 24,
          pointer.y - ny * 18,
          glowRadius * 0.72
        );
        halo.addColorStop(0, "rgba(255, 250, 228, " + (0.05 + sparkle * 0.05) + ")");
        halo.addColorStop(1, "rgba(255, 250, 228, 0)");
        ctx.fillStyle = halo;
        ctx.fillRect(pointer.x - glowRadius, pointer.y - glowRadius, glowRadius * 2, glowRadius * 2);

        particles.forEach((particle) => {
          particle.x += (particle.vx + Math.sin(time * 0.00036 + particle.phase) * 0.025) * dt * 6;
          particle.y += particle.vy * dt * 6;

          const dx = particle.x - pointer.x;
          const dy = particle.y - pointer.y;
          const distance = Math.hypot(dx, dy) || 1;
          const disturb = clamp(1 - distance / (100 + particle.depth * 50), 0, 1) * (reducedMotion ? 0.35 : 1);

          particle.x += (dx / distance) * disturb * 1.8 * dt;
          particle.y += (dy / distance) * disturb * 1.2 * dt;

          if (particle.y < -40 || particle.x < -60 || particle.x > width + 60) {
            recycleParticle(particle);
          }

          const shimmer = 0.52 + Math.sin(time * 0.0022 * particle.depth + particle.phase * 2.1) * 0.44;
          const sunDx = (particle.x - width * 0.18) / Math.max(120, width * 0.28);
          const sunDy = (particle.y - height * 0.2) / Math.max(100, height * 0.24);
          const sunLight = clamp(1 - Math.hypot(sunDx, sunDy), 0, 1);
          const alpha = particle.alpha * shimmer * (1 + sunLight * (particle.warm ? 0.42 : 0.14));
          const color = particle.warm
            ? "rgba(255, " + Math.round(223 + sunLight * 18) + ", " + Math.round(165 + sunLight * 26) + ", " + alpha + ")"
            : "rgba(207, 242, 214, " + (alpha * 0.82) + ")";

          ctx.beginPath();
          ctx.fillStyle = color;
          ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
          ctx.fill();

          if (sunLight > 0.1 && particle.warm) {
            ctx.beginPath();
            ctx.fillStyle = "rgba(255, 248, 227, " + alpha * sunLight * 0.12 + ")";
            ctx.ellipse(particle.x, particle.y, particle.size * (1.4 + sunLight * 2.6), particle.size * 0.62, -0.46, 0, Math.PI * 2);
            ctx.fill();
          }

          if (particle.glow) {
            ctx.beginPath();
            ctx.fillStyle = particle.warm
              ? "rgba(255, 190, 103, " + alpha * 0.22 + ")"
              : "rgba(177, 222, 210, " + alpha * 0.18 + ")";
            ctx.arc(particle.x, particle.y, particle.size * 3.2, 0, Math.PI * 2);
            ctx.fill();
          }
        });

        ctx.restore();
      }

      function updateButterflies(time, dt, motionScale) {
        butterflies.forEach((butterfly) => {
          const baseTime = time * 0.00058 * butterfly.speed;
          let finalX = butterfly.currentX;
          let finalY = butterfly.currentY;
          let rotation = butterfly.rotation;
          let displayScale = butterfly.currentScale || butterfly.scale;
          let wingTilt = Math.cos(baseTime * 4.2 + butterfly.phase) * 8;
          let flap = 0.48 + (Math.sin(time * 0.018 * butterfly.speed + butterfly.phase * 4.8) * 0.5 + 0.5) * 0.65;
          let alpha = butterfly.baseOpacity;
          let vanish = 0;
          let burst = 0;

          if (butterfly.status === "respawning") {
            if (time >= butterfly.respawnAt) {
              respawnButterfly(butterfly, time);
            } else {
              butterfly.element.style.opacity = "0";
              butterfly.element.style.transform = "translate3d(-9999px, -9999px, 0)";
              return;
            }
          }

          if (butterfly.status === "targeting") {
            const raw = clamp((time - butterfly.targetStart) / butterfly.targetDuration, 0, 1);
            const hover = Math.sin(time * 0.012 + butterfly.phase) * (reducedMotion ? 1.1 : 2.2);
            finalX = butterfly.lockX + Math.cos(time * 0.01 + butterfly.phase) * (reducedMotion ? 1.2 : 2.4);
            finalY = butterfly.lockY + hover;
            rotation = butterfly.lockRotation * (1 - raw * 0.55) + Math.sin(time * 0.018 + butterfly.phase) * 5;
            displayScale = butterfly.lockScale * (1 + Math.sin(raw * Math.PI) * (reducedMotion ? 0.012 : 0.03));
            wingTilt = Math.cos(time * 0.02 + butterfly.phase) * 6;
            flap = 0.56 + (Math.sin(time * 0.028 + butterfly.phase * 5.2) * 0.5 + 0.5) * 0.44;
            collection.progress = raw;
            collection.focusStrength = 0.68 + Math.sin(raw * Math.PI) * 0.18;

            if (raw >= 1) {
              startButterflyBurst(butterfly, time);
            }
          }

          if (butterfly.status === "burst") {
            const raw = clamp((time - butterfly.burstStart) / butterfly.burstDuration, 0, 1);
            finalX = butterfly.lockX;
            finalY = butterfly.lockY - raw * (reducedMotion ? 3 : 8);
            rotation = butterfly.lockRotation * (1 - raw * 0.8);
            displayScale = butterfly.lockScale * (1 - raw * 0.12);
            alpha = butterfly.baseOpacity * (1 - raw * 0.72);
            vanish = raw;
            burst = raw;
            collection.progress = raw;
            collection.focusStrength = 0.26 * (1 - raw);

            if (raw >= 1) {
              butterfly.status = "respawning";
              finishButterflyTarget(butterfly);
              butterfly.element.style.opacity = "0";
              return;
            }
          } else if (butterfly.status !== "targeting") {
            const orbitX = Math.sin(baseTime + butterfly.phase) * width * butterfly.radiusX;
            const orbitY = Math.cos(baseTime * 1.2 + butterfly.phase) * height * butterfly.radiusY;
            const bob = Math.sin(baseTime * 3.8 + butterfly.phase) * 6 * motionScale;
            const baseX = width * butterfly.centerX + orbitX + Math.cos(baseTime * 1.7 + butterfly.phase * 0.6) * 18;
            const baseY = height * butterfly.centerY + orbitY + bob;
            const dx = baseX - pointer.x;
            const dy = baseY - pointer.y;
            const distance = Math.hypot(dx, dy) || 1;
            const repel = clamp(1 - distance / 170, 0, 1) * motionScale;

            butterfly.offsetX = lerp(butterfly.offsetX, (dx / distance) * repel * 44, 0.12 * dt);
            butterfly.offsetY = lerp(butterfly.offsetY, (dy / distance) * repel * 32 - repel * 14, 0.12 * dt);

            finalX = baseX + butterfly.offsetX;
            finalY = baseY + butterfly.offsetY;
            rotation = Math.sin(baseTime * 5 + butterfly.phase) * 14 + butterfly.offsetX * 0.18;
            wingTilt = Math.cos(baseTime * 4.2 + butterfly.phase) * 8;
            flap = 0.48 + (Math.sin(time * 0.018 * butterfly.speed + butterfly.phase * 4.8) * 0.5 + 0.5) * 0.65;
            displayScale = butterfly.scale * (1 + bob * 0.003);

            if (butterfly.status === "revealing") {
              const reveal = clamp((time - butterfly.revealStart) / butterfly.revealDuration, 0, 1);
              alpha *= reveal;
              displayScale *= 0.96 + reveal * 0.04;

              if (reveal >= 1) {
                butterfly.status = "idle";
                butterfly.element.disabled = false;
              }
            }
          }

          butterfly.currentX = finalX;
          butterfly.currentY = finalY;
          butterfly.currentScale = displayScale;
          butterfly.rotation = rotation;
          setButterflySparkle(butterfly, vanish, burst);

          butterfly.element.style.transform =
            "translate3d(" +
            finalX.toFixed(2) +
            "px, " +
            finalY.toFixed(2) +
            "px, 0) rotate(" +
            rotation.toFixed(2) +
            "deg) scale(" +
            displayScale.toFixed(3) +
            ")";
          butterfly.element.style.opacity = alpha.toFixed(3);

          butterfly.wings[0].style.transform = "rotate(" + (-26 - wingTilt).toFixed(2) + "deg) scaleX(" + flap.toFixed(3) + ")";
          butterfly.wings[1].style.transform = "rotate(" + (26 + wingTilt).toFixed(2) + "deg) scaleX(" + flap.toFixed(3) + ")";

          if ((butterfly.status === "targeting" || butterfly.status === "burst") && collection.active === butterfly) {
            const focus = butterflyFocusScene(butterfly);
            collection.focusSceneX = focus.x;
            collection.focusSceneY = focus.y;
          }
        });
      }

      function renderBeams(time, clearingRect) {
        if (!collection.active || !collection.beamVisible || !clearingRect) {
          clearBeams();
          return;
        }

        const endX = collection.focusLocalX;
        const endY = collection.focusLocalY;
        beamSvg.classList.add("is-active");

        beamPaths.forEach(({ source, glow, core }) => {
          const rect = source.getBoundingClientRect();
          const startX = rect.left - clearingRect.left + rect.width * 0.5;
          const startY = rect.top - clearingRect.top + rect.height * 0.56;
          const d =
            "M " +
            startX.toFixed(2) +
            " " +
            startY.toFixed(2) +
            " L " +
            endX.toFixed(2) +
            " " +
            endY.toFixed(2);

          glow.setAttribute("d", d);
          core.setAttribute("d", d);
        });

        beamSpark.setAttribute("cx", endX.toFixed(2));
        beamSpark.setAttribute("cy", endY.toFixed(2));
        beamSpark.setAttribute("r", (reducedMotion ? 3.8 : 4.6 + Math.sin(time * 0.01) * 0.35).toFixed(2));
        beamSpark.style.opacity = reducedMotion ? "0.72" : "0.82";
      }

      function animate(time) {
        if (!lastTime) {
          lastTime = time;
        }

        const delta = Math.min(32, time - lastTime || 16.67);
        const dt = delta / 16.67;
        lastTime = time;

        if (!pointer.active) {
          const idleX = width * 0.68 + Math.cos(time * 0.00021) * width * 0.03;
          const idleY = height * 0.42 + Math.sin(time * 0.00017 + 0.6) * height * 0.02;
          pointer.targetX = coarsePointer ? width * 0.68 : idleX;
          pointer.targetY = coarsePointer ? height * 0.42 : idleY;
        }

        pointer.vx += (pointer.targetX - pointer.x) * 0.05 * dt;
        pointer.vy += (pointer.targetY - pointer.y) * 0.05 * dt;
        pointer.vx *= 0.78;
        pointer.vy *= 0.78;
        pointer.x += pointer.vx;
        pointer.y += pointer.vy;

        const nx = (pointer.x / width - 0.5) * 2;
        const ny = (pointer.y / height - 0.5) * 2;
        const motionScale = reducedMotion ? 0.45 : 1;

        scene.style.setProperty("--pointer-x", pointer.x.toFixed(2) + "px");
        scene.style.setProperty("--pointer-y", pointer.y.toFixed(2) + "px");
        scene.style.setProperty("--pointer-alpha", (0.74 + sparkle * 0.18).toFixed(3));

        sparkle = lerp(sparkle, 0, 0.06 * dt);
        updateBasketMotion(time);

        parallaxLayers.forEach((layer) => {
          const depth = Number(layer.dataset.depth || 0);
          const driftX = Math.sin(time * 0.00014 + depth * 13) * depth * 10 * motionScale;
          const driftY = Math.cos(time * 0.00011 + depth * 9) * depth * 7 * motionScale;
          const tx = -nx * depth * 30 * motionScale + driftX;
          const ty = -ny * depth * 18 * motionScale + driftY;
          layer.style.transform = "translate3d(" + tx.toFixed(2) + "px, " + ty.toFixed(2) + "px, 0)";
        });

        carrotStates.forEach((state) => {
          if (state.phase === "transport" || state.phase === "drop" || state.phase === "bounce" || state.phase === "collected" || state.phase === "release") {
            return;
          }

          const driftX = Math.sin(time * 0.0011 + state.floatPhase) * state.floatAmount * 1.4 * motionScale;
          const driftY = Math.cos(time * 0.0014 + state.floatPhase * 1.2) * state.floatAmount * 1.1 * motionScale;
          const offsetX = -nx * state.parallax * 18 * motionScale + driftX;
          const offsetY = -ny * state.parallax * 10 * motionScale + driftY;
          state.element.style.setProperty("--idle-parallax-x", offsetX.toFixed(2) + "px");
          state.element.style.setProperty("--idle-parallax-y", offsetY.toFixed(2) + "px");
        });

        if (time > blink.next) {
          scheduleBlink(time);
        }

        if (time > earTwitch.left.next) {
          triggerEarTwitch("left", time);
        }

        if (time > earTwitch.right.next) {
          triggerEarTwitch("right", time);
        }

        if (time > idleAttention.next && collection.phase === "idle") {
          scheduleIdleAttention(time);
        }

        updateCollection(time);
        carrotStates.forEach((state) => {
          if (state.phase === "release") {
            updateReleasePhase(state, time);
          }
        });
        updateButterflies(time, dt, motionScale);

        const collectionActive = collection.phase !== "idle";
        let activeClearingRect = null;

        if (collectionActive || collection.beamVisible) {
          activeClearingRect = clearing.getBoundingClientRect();
          if (collection.focusSpace === "scene") {
            collection.focusLocalX = collection.focusSceneX - (activeClearingRect.left - sceneLeft);
            collection.focusLocalY = collection.focusSceneY - (activeClearingRect.top - sceneTop);
          } else {
            collection.focusSceneX = activeClearingRect.left - sceneLeft + collection.focusLocalX;
            collection.focusSceneY = activeClearingRect.top - sceneTop + collection.focusLocalY;
          }
        }

        const blinkValue = envelope(blink.start, blink.duration, time);
        const leftTwitch = envelope(earTwitch.left.start, earTwitch.left.duration, time);
        const rightTwitch = envelope(earTwitch.right.start, earTwitch.right.duration, time);
        const breathing = Math.sin(time * 0.00185) * 1.55 * motionScale;
        const sway = Math.sin(time * 0.00078 + 0.7) * 2.8 * motionScale;
        const posture = Math.sin(time * 0.00105 + 2) * 1.2 * motionScale;
        const earDrift = Math.sin(time * 0.0015 + 1.4) * 0.8 * motionScale;

        const reactionActive = time < reaction.start + reaction.duration;
        const reactionEnvelope = reactionActive ? Math.sin(((time - reaction.start) / reaction.duration) * Math.PI) : 0;
        const reactionMode = reactionActive ? reaction.mode : "idle";
        const effectiveReactionMode = collectionActive ? "idle" : reactionMode;
        const effectiveReactionEnvelope = collectionActive ? 0 : reactionEnvelope;
        const idleAttentionActive = !collectionActive && time < idleAttention.start + idleAttention.duration;
        const idleAttentionEnvelope = idleAttentionActive ? Math.sin(((time - idleAttention.start) / idleAttention.duration) * Math.PI) : 0;
        const idleAttentionWeight = !pointer.active && effectiveReactionMode === "idle" ? idleAttentionEnvelope : idleAttentionEnvelope * 0.24;

        let targetLookX = clamp(((pointer.x - bunnyAnchor.x) / Math.max(180, width * 0.24)) * 12, -12, 12);
        let targetLookY = clamp(((pointer.y - bunnyAnchor.y) / Math.max(150, height * 0.24)) * 7, -7, 7);

        if (collectionActive) {
          const collectLookX = clamp(((collection.focusSceneX - bunnyAnchor.x) / Math.max(160, width * 0.2)) * 12.8, -12.8, 12.8);
          const collectLookY = clamp(((collection.focusSceneY - bunnyAnchor.y) / Math.max(148, height * 0.22)) * 7.2, -6.6, 6.4);
          const focusBlend = collection.phase === "transport" ? 0.94 : collection.phase === "drop" ? 0.86 : collection.phase === "butterfly-target" ? 0.92 : 0.62;
          targetLookX = lerp(targetLookX, collectLookX, focusBlend);
          targetLookY = lerp(targetLookY, collectLookY, focusBlend);
        } else if (effectiveReactionMode !== "idle") {
          const reactionLookX = clamp(((reaction.focusX - bunnyAnchor.x) / Math.max(170, width * 0.22)) * 12, -12, 12);
          const reactionLookY = clamp(((reaction.focusY - bunnyAnchor.y) / Math.max(150, height * 0.24)) * 7, -6, 6);

          if (effectiveReactionMode === "glance") {
            targetLookX = lerp(targetLookX, reactionLookX, 0.6);
            targetLookY = lerp(targetLookY, reactionLookY, 0.6);
          } else if (effectiveReactionMode === "perk") {
            targetLookX = lerp(targetLookX, reactionLookX, 0.36);
            targetLookY -= effectiveReactionEnvelope * 1.3;
          } else if (effectiveReactionMode === "hop") {
            targetLookX = lerp(targetLookX, reactionLookX, 0.52);
            targetLookY -= effectiveReactionEnvelope * 1.8;
          }
        }

        targetLookX = clamp(targetLookX + idleAttention.lookX * idleAttentionWeight, -13.2, 13.2);
        targetLookY = clamp(targetLookY + idleAttention.lookY * idleAttentionWeight, -7.4, 7.2);

        const headX = spring(headSpringX, targetLookX, 0.14 * dt, 0.72);
        const headY = spring(headSpringY, targetLookY, 0.14 * dt, 0.72);
        const hop = effectiveReactionMode === "hop" ? effectiveReactionEnvelope * 18 * motionScale : 0;
        const perk = effectiveReactionMode === "perk" ? effectiveReactionEnvelope * 1.2 * motionScale : 0;
        const glance = effectiveReactionMode === "glance" ? effectiveReactionEnvelope * 1.1 * motionScale : 0;
        const focusTension = collectionActive ? collection.focusStrength : 0;
        const focusBase = collection.phase === "transport" ? 0.35 : collection.phase === "drop" ? 0.2 : collection.phase === "butterfly-target" ? 0.42 : collection.phase === "butterfly-burst" ? 0.18 : 0.08;
        const focusLean = collectionActive
          ? clamp((collection.focusSceneX - bunnyAnchor.x) / Math.max(84, width * 0.12), -1, 1) * (reducedMotion ? 2.4 : 4.8) * Math.max(focusTension, focusBase)
          : 0;
        const focusLift = collection.phase === "transport"
          ? 1.4 + Math.sin(collection.progress * Math.PI) * 1.4
          : collection.phase === "drop"
            ? 0.9
            : collection.phase === "bounce"
              ? 0.36
              : collection.phase === "butterfly-target"
                ? 0.82 + Math.sin(collection.progress * Math.PI) * 0.64
                : collection.phase === "butterfly-burst"
                  ? 0.28
              : 0;
        const focusedBreathing = breathing * (1 - focusTension * 0.38);
        const focusedSway = sway * (1 - focusTension * 0.56);
        const idleLift = idleAttention.lift * idleAttentionWeight;
        const idleTilt = Math.sin(time * 0.00062 + 0.8) * 1.7 * motionScale + idleAttention.tilt * idleAttentionWeight * 0.92;
        const headTilt = spring(headTiltSpring, idleTilt + focusLean * 0.28, 0.12 * dt, 0.74);

        bunny.style.transform =
          "translateY(" +
          (-hop * 0.3 + posture * 0.4 - focusLift * 0.46 - idleLift * 0.2).toFixed(2) +
          "px) rotate(" +
          (focusedSway * 0.12 + focusLean * 0.16 + headTilt * 0.08).toFixed(2) +
          "deg)";

        bunnyBody.style.transform =
          "translateX(-50%) translate(" +
          (focusLean * 0.16).toFixed(2) +
          "px, " +
          (-hop * 0.42 + focusedBreathing * 0.38 - focusLift * 0.58 - idleLift * 0.24).toFixed(2) +
          "px) scale(" +
          (1 + focusedBreathing * 0.007 - focusTension * 0.008).toFixed(3) +
          ", " +
          (1 - focusedBreathing * 0.009 + focusTension * 0.01).toFixed(3) +
          ")";

        bunnyHead.style.transform =
          "translateX(-50%) translate(" +
          (headX + focusLean * 0.46).toFixed(2) +
          "px, " +
          (headY - hop * 0.62 - focusedBreathing * 0.3 - focusLift * 0.88 - idleLift).toFixed(2) +
          "px) rotate(" +
          (headX * 0.42 + focusedSway * 0.18 + focusLean * 0.24 + headTilt).toFixed(2) +
          "deg)";

        bunnyShadow.style.transform =
          "translateX(-50%) scale(" +
          (1 - hop * 0.008 + Math.abs(nx) * 0.015 + focusTension * 0.01).toFixed(3) +
          ", " +
          (1 - hop * 0.01 - focusLift * 0.01).toFixed(3) +
          ")";

        ears.left.style.transform =
          "rotate(" +
          (-8 + headX * 0.3 - leftTwitch * 18 - perk * 8 + glance * 1.6 - focusTension * 4.2 - headTilt * 0.36 - earDrift).toFixed(2) +
          "deg) translateY(" +
          (-focusedBreathing * 0.6 - perk * 1.6 - focusTension * 0.6 - idleLift * 0.12).toFixed(2) +
          "px)";

        ears.right.style.transform =
          "rotate(" +
          (8 + headX * 0.22 + rightTwitch * 17 + perk * 7 - glance * 1.4 + focusTension * 4.2 + headTilt * 0.42 + earDrift).toFixed(2) +
          "deg) translateY(" +
          (-focusedBreathing * 0.48 - perk * 1.2 - focusTension * 0.5 - idleLift * 0.08).toFixed(2) +
          "px)";

        eyes.forEach((eye, index) => {
          const direction = index === 0 ? -1 : 1;
          eye.style.setProperty("--blink", blinkValue.toFixed(3));

          const irisX = clamp(headX * 0.24 + direction * glance * 0.3 + focusLean * 0.05 + headTilt * 0.12, -3.2, 3.2);
          const irisY = clamp(headY * 0.18 - perk * 0.2 - focusTension * 0.14 - idleLift * 0.08, -2, 1.8);
          irises[index].style.setProperty("--iris-x", irisX.toFixed(2) + "px");
          irises[index].style.setProperty("--iris-y", irisY.toFixed(2) + "px");
          irises[index].style.opacity = (1 - blinkValue * 0.9).toFixed(3);
        });

        cheeks.forEach((cheek) => {
          cheek.style.opacity = (0.66 + effectiveReactionEnvelope * 0.18 + focusTension * 0.12).toFixed(3);
        });

        whiskers.forEach((whisker, index) => {
          const direction = index < 2 ? -1 : 1;
          whisker.style.transform =
            "rotate(" +
            ((index % 2 === 0 ? -8 : 12) * direction + headX * 0.22 * direction + focusLean * 0.18 * direction + headTilt * 0.14 * direction).toFixed(2) +
            "deg) translateX(" +
            (headX * 0.08 * direction + focusTension * 0.26 * direction).toFixed(2) +
            "px)";
        });

        renderBeams(time, activeClearingRect);

        drawParticles(time, dt, nx, ny);
        requestAnimationFrame(animate);
      }

      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
