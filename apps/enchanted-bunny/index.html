<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enchanted Forest Bunny</title>
  <style>
    :root {
      color-scheme: only light;
      --text: #fff6ea;
      --border: rgba(255, 246, 230, 0.24);
      --panel: rgba(34, 28, 24, 0.26);
      --panel-strong: rgba(34, 28, 24, 0.46);
      --pointer-x: 68vw;
      --pointer-y: 42vh;
      --pointer-alpha: 0.78;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 14%, rgba(255, 233, 177, 0.22), transparent 24%),
        linear-gradient(180deg, #1f2f26 0%, #18231b 42%, #0f1712 100%);
    }

    a {
      color: inherit;
    }

    button {
      font: inherit;
    }

    .scene {
      position: relative;
      min-height: 100svh;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at 18% 16%, rgba(255, 242, 198, 0.94), rgba(255, 214, 133, 0.45) 16%, rgba(255, 214, 133, 0.08) 28%, transparent 38%),
        radial-gradient(circle at 26% 28%, rgba(255, 203, 120, 0.24), transparent 26%),
        linear-gradient(180deg, #7f976c 0%, #4f6146 16%, #203127 52%, #111a15 100%);
    }

    .scene::before {
      content: "";
      position: absolute;
      inset: -12%;
      pointer-events: none;
      background:
        radial-gradient(circle at var(--pointer-x) var(--pointer-y), rgba(255, 235, 184, calc(var(--pointer-alpha) * 0.22)), transparent 14%),
        radial-gradient(circle at calc(var(--pointer-x) - 8%) calc(var(--pointer-y) + 6%), rgba(255, 215, 136, calc(var(--pointer-alpha) * 0.1)), transparent 10%),
        radial-gradient(circle at 74% 18%, rgba(255, 247, 224, 0.08), transparent 18%);
      mix-blend-mode: screen;
      z-index: 1;
    }

    .scene::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 112%, transparent 0 40%, rgba(0, 0, 0, 0.18) 82%, rgba(0, 0, 0, 0.34) 100%),
        linear-gradient(180deg, rgba(9, 12, 10, 0) 0%, rgba(9, 12, 10, 0.08) 58%, rgba(7, 9, 7, 0.34) 100%);
      z-index: 16;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .back-link {
      position: absolute;
      top: 1rem;
      left: 1rem;
      z-index: 18;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.72rem 1rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255, 250, 242, 0.18), rgba(255, 250, 242, 0.08));
      color: rgba(255, 248, 237, 0.96);
      text-decoration: none;
      box-shadow: 0 16px 36px rgba(11, 16, 13, 0.24);
      backdrop-filter: blur(14px);
      transition: transform 180ms ease, background-color 180ms ease, border-color 180ms ease;
    }

    .back-link:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 246, 230, 0.42);
      background: linear-gradient(180deg, rgba(255, 250, 242, 0.22), rgba(255, 250, 242, 0.1));
    }

    .back-link:focus-visible,
    .carrot:focus-visible {
      outline: 2px solid rgba(255, 233, 183, 0.9);
      outline-offset: 4px;
    }

    .back-link::before {
      content: "";
      width: 0.72rem;
      height: 0.72rem;
      border-top: 2px solid currentColor;
      border-left: 2px solid currentColor;
      transform: rotate(-45deg);
    }

    .layer {
      position: absolute;
      inset: -6%;
      pointer-events: none;
      will-change: transform;
    }

    .sky-haze {
      z-index: 0;
      background:
        radial-gradient(circle at 18% 12%, rgba(255, 244, 205, 0.7), transparent 20%),
        radial-gradient(circle at 28% 20%, rgba(255, 199, 116, 0.2), transparent 26%),
        linear-gradient(180deg, rgba(255, 244, 213, 0.18) 0%, rgba(255, 241, 220, 0.05) 32%, transparent 64%);
    }

    .sun-core {
      position: absolute;
      top: 5%;
      left: 8%;
      width: min(32rem, 42vw);
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(255, 249, 230, 0.96) 0%, rgba(255, 228, 160, 0.9) 18%, rgba(255, 204, 118, 0.28) 42%, rgba(255, 204, 118, 0) 72%);
      filter: blur(4px);
      opacity: 0.9;
    }

    .horizon-glow {
      position: absolute;
      inset: auto -8% 26% -8%;
      height: 32%;
      background:
        radial-gradient(ellipse at 34% 50%, rgba(255, 213, 142, 0.42), transparent 36%),
        radial-gradient(ellipse at 48% 58%, rgba(255, 206, 154, 0.18), transparent 40%);
      filter: blur(24px);
      mix-blend-mode: screen;
      opacity: 0.72;
    }

    .sun-volumetrics {
      z-index: 2;
      mix-blend-mode: screen;
      opacity: 0.84;
    }

    .sun-volumetrics::before,
    .sun-volumetrics::after {
      content: "";
      position: absolute;
      pointer-events: none;
    }

    .sun-volumetrics::before {
      top: 4%;
      left: 6%;
      width: min(32rem, 42vw);
      height: min(24rem, 34vw);
      background:
        radial-gradient(circle at 14% 20%, rgba(255, 250, 236, 0.54) 0 0.12rem, transparent 0.14rem),
        radial-gradient(circle at 28% 24%, rgba(255, 239, 204, 0.38) 0 0.1rem, transparent 0.12rem),
        radial-gradient(circle at 34% 14%, rgba(255, 245, 225, 0.48) 0 0.11rem, transparent 0.13rem),
        radial-gradient(circle at 42% 28%, rgba(255, 233, 187, 0.42) 0 0.12rem, transparent 0.14rem),
        radial-gradient(circle at 18% 42%, rgba(255, 248, 224, 0.34) 0 0.09rem, transparent 0.11rem),
        radial-gradient(circle at 36% 46%, rgba(255, 243, 219, 0.3) 0 0.08rem, transparent 0.1rem),
        radial-gradient(circle at 52% 36%, rgba(255, 229, 183, 0.26) 0 0.08rem, transparent 0.1rem);
      filter: blur(0.7px);
      opacity: 0.78;
    }

    .sun-volumetrics::after {
      top: -4%;
      left: 4%;
      width: min(46rem, 60vw);
      height: min(38rem, 46vw);
      background: radial-gradient(circle at 24% 20%, rgba(255, 239, 196, 0.18), rgba(255, 239, 196, 0.04) 34%, transparent 58%);
      filter: blur(14px);
      opacity: 0.82;
    }

    .sun-rays {
      z-index: 2;
      opacity: 0.78;
    }

    .sun-ray {
      position: absolute;
      top: -18%;
      left: 10%;
      width: clamp(3.8rem, 8vw, 6.8rem);
      height: 152%;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255, 246, 213, 0.34), rgba(255, 224, 164, 0.16) 34%, rgba(255, 224, 164, 0.04) 72%, transparent 100%);
      filter: blur(22px);
      mix-blend-mode: screen;
      opacity: 0.72;
      transform-origin: top center;
    }

    .ray-1 {
      left: 11%;
      width: clamp(4rem, 7vw, 5.8rem);
      transform: rotate(18deg);
    }

    .ray-2 {
      left: 16%;
      width: clamp(4.8rem, 8vw, 6.8rem);
      opacity: 0.68;
      transform: rotate(24deg);
    }

    .ray-3 {
      left: 22%;
      width: clamp(4rem, 6.8vw, 5.2rem);
      opacity: 0.44;
      transform: rotate(30deg);
    }

    .ray-4 {
      left: 28%;
      width: clamp(3.2rem, 5vw, 4.2rem);
      opacity: 0.26;
      transform: rotate(36deg);
    }

    .sun-streak {
      position: absolute;
      top: -20%;
      left: 12%;
      width: clamp(1.8rem, 2.8vw, 2.8rem);
      height: 164%;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255, 250, 231, 0.44), rgba(255, 224, 161, 0.14) 36%, rgba(255, 224, 161, 0.02) 76%, transparent 100%);
      filter: blur(12px);
      opacity: 0.58;
      transform-origin: top center;
    }

    .streak-1 {
      left: 14%;
      transform: rotate(20deg);
    }

    .streak-2 {
      left: 21%;
      height: 154%;
      opacity: 0.42;
      transform: rotate(26deg);
    }

    .streak-3 {
      left: 28%;
      width: clamp(1.4rem, 2.2vw, 2.2rem);
      height: 148%;
      opacity: 0.26;
      transform: rotate(33deg);
    }

    .forest {
      inset: auto -8% 18% -8%;
      height: 72%;
    }

    .forest.far {
      z-index: 3;
      opacity: 0.7;
      filter: blur(1.1px);
    }

    .forest.mid {
      z-index: 4;
      opacity: 0.92;
    }

    .tree {
      position: absolute;
      bottom: 0;
      left: var(--x);
      width: var(--w);
      height: var(--h);
      border-radius: 999px 999px 1.4rem 1.4rem;
      background:
        linear-gradient(180deg, var(--bark-top), var(--bark-mid) 42%, var(--bark-bottom) 100%);
      box-shadow:
        inset -0.4rem 0 0 rgba(255, 255, 255, 0.04),
        inset 0.4rem 0 0 rgba(15, 21, 16, 0.14),
        0 0 30px rgba(11, 17, 13, 0.18);
    }

    .forest.far .tree {
      --bark-top: #334334;
      --bark-mid: #263228;
      --bark-bottom: #1a231b;
    }

    .forest.mid .tree {
      --bark-top: #4f6044;
      --bark-mid: #34412d;
      --bark-bottom: #1c261e;
    }

    .tree::before,
    .tree::after {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 50%;
      pointer-events: none;
    }

    .tree::before {
      bottom: calc(100% - 6%);
      width: calc(100% * 4);
      height: calc(100% * 0.52);
      background:
        radial-gradient(circle at 48% 58%, var(--leaf-mid) 0%, var(--leaf-mid) 44%, var(--leaf-deep) 72%, transparent 84%);
      filter: blur(6px);
      opacity: 0.98;
    }

    .tree::after {
      bottom: calc(100% + 2%);
      width: calc(100% * 5.6);
      height: calc(100% * 0.44);
      background:
        radial-gradient(circle at 18% 64%, var(--leaf-mid), transparent 52%),
        radial-gradient(circle at 80% 64%, var(--leaf-mid), transparent 50%),
        radial-gradient(circle at 50% 38%, var(--leaf-light), transparent 58%);
      filter: blur(9px);
      opacity: 0.9;
    }

    .forest.far .tree {
      --leaf-light: rgba(113, 133, 88, 0.34);
      --leaf-mid: rgba(70, 88, 55, 0.86);
      --leaf-deep: rgba(27, 38, 24, 0.9);
    }

    .forest.mid .tree {
      --leaf-light: rgba(146, 167, 98, 0.44);
      --leaf-mid: rgba(82, 109, 59, 0.95);
      --leaf-deep: rgba(31, 49, 26, 0.96);
    }

    .mist {
      z-index: 5;
      left: -10%;
      width: 120%;
      height: 18rem;
      border-radius: 50%;
      filter: blur(18px);
      mix-blend-mode: screen;
      background:
        radial-gradient(ellipse at center, rgba(255, 233, 208, 0.26), rgba(255, 233, 208, 0.14) 36%, rgba(255, 233, 208, 0) 74%);
      opacity: 0.8;
    }

    .mist-a {
      bottom: 18%;
    }

    .mist-b {
      bottom: 8%;
      height: 14rem;
      opacity: 0.5;
    }

    .particles {
      position: absolute;
      inset: 0;
      z-index: 7;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .butterflies {
      z-index: 8;
    }

    .butterflies-close {
      z-index: 10;
    }

    .butterfly {
      position: absolute;
      top: 0;
      left: 0;
      width: 3.2rem;
      height: 2.8rem;
      padding: 0;
      border: 0;
      appearance: none;
      background: transparent;
      display: block;
      cursor: pointer;
      pointer-events: auto;
      transform-origin: 50% 50%;
      filter: drop-shadow(0 0 18px rgba(255, 207, 140, 0.18));
      opacity: 0.92;
      --butterfly-vanish: 0;
      --burst-progress: 0;
    }

    .butterfly-close {
      width: 4.6rem;
      height: 4rem;
      filter: blur(0.8px) drop-shadow(0 0 22px rgba(255, 218, 162, 0.22));
      opacity: 0.72;
    }

    .butterfly-close .wing {
      box-shadow:
        inset 0 0 16px rgba(255, 251, 242, 0.28),
        0 0 22px rgba(255, 205, 146, 0.14);
    }

    .butterfly:focus-visible {
      outline: 2px solid rgba(217, 255, 198, 0.86);
      outline-offset: 4px;
    }

    .butterfly:disabled {
      cursor: default;
    }

    .butterfly.is-targeted {
      filter:
        drop-shadow(0 0 12px rgba(169, 255, 196, 0.24))
        drop-shadow(0 0 20px rgba(255, 207, 140, 0.24));
    }

    .wing {
      position: absolute;
      top: 18%;
      width: 46%;
      height: 58%;
      border-radius: 64% 36% 58% 42%;
      background:
        radial-gradient(circle at 34% 32%, rgba(255, 253, 248, 0.98), rgba(255, 222, 156, 0.82) 42%, rgba(255, 169, 101, 0.62) 76%, rgba(255, 139, 88, 0.2) 100%);
      box-shadow:
        inset 0 0 14px rgba(255, 251, 242, 0.32),
        0 0 16px rgba(255, 198, 133, 0.12);
      transform-origin: 100% 80%;
      opacity: calc(1 - var(--butterfly-vanish));
      transition: opacity 140ms ease;
    }

    .wing-left {
      left: 7%;
      transform: rotate(-26deg) scaleX(0.8);
    }

    .wing-right {
      right: 7%;
      transform-origin: 0% 80%;
      transform: rotate(26deg) scaleX(0.8);
    }

    .butterfly-body {
      position: absolute;
      left: 50%;
      top: 30%;
      width: 0.36rem;
      height: 1.28rem;
      transform: translateX(-50%);
      border-radius: 999px;
      background: linear-gradient(180deg, #5b4639, #2c221d);
      box-shadow: 0 0 10px rgba(255, 216, 144, 0.12);
      opacity: calc(1 - var(--butterfly-vanish));
      transition: opacity 140ms ease;
    }

    .butterfly-body::before,
    .butterfly-body::after {
      content: "";
      position: absolute;
      bottom: 100%;
      width: 0.08rem;
      height: 0.5rem;
      border-radius: 999px;
      background: rgba(255, 231, 188, 0.8);
      transform-origin: bottom center;
    }

    .butterfly-body::before {
      left: 0.03rem;
      transform: rotate(-18deg);
    }

    .butterfly-body::after {
      right: 0.03rem;
      transform: rotate(18deg);
    }

    .butterfly-burst {
      position: absolute;
      inset: 10%;
      border-radius: 50%;
      pointer-events: none;
      opacity: calc(var(--burst-progress) * 0.98);
      transform: scale(calc(0.36 + var(--burst-progress) * 1.14));
      filter: blur(0.6px);
      mix-blend-mode: screen;
      background:
        radial-gradient(circle at 50% 50%, rgba(255, 254, 248, 0.98) 0 16%, rgba(255, 239, 200, 0.78) 28%, rgba(255, 203, 155, 0.28) 48%, rgba(255, 203, 155, 0) 76%);
    }

    .butterfly-burst::before,
    .butterfly-burst::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      opacity: calc(var(--burst-progress) * 0.94);
    }

    .butterfly-burst::before {
      background:
        radial-gradient(circle at 24% 38%, rgba(255, 250, 243, 0.92) 0 0.16rem, transparent 0.17rem),
        radial-gradient(circle at 78% 24%, rgba(255, 235, 191, 0.86) 0 0.13rem, transparent 0.14rem),
        radial-gradient(circle at 70% 74%, rgba(255, 223, 186, 0.82) 0 0.14rem, transparent 0.15rem),
        radial-gradient(circle at 34% 76%, rgba(255, 245, 229, 0.88) 0 0.15rem, transparent 0.16rem);
      transform: scale(calc(0.84 + var(--burst-progress) * 0.34));
    }

    .butterfly-burst::after {
      inset: 18%;
      background:
        radial-gradient(circle at 50% 50%, rgba(255, 247, 233, 0.82), rgba(255, 219, 177, 0));
      filter: blur(1.2px);
      transform: scale(calc(0.72 + var(--burst-progress) * 0.42));
    }

    .butterfly.is-bursting .wing,
    .butterfly.is-bursting .butterfly-body {
      filter: blur(calc(var(--butterfly-vanish) * 1.6px));
    }

    .clearing {
      inset: auto 0 0 0;
      height: min(50vh, 30rem);
      z-index: 9;
      --basket-left: calc(50% + min(8vw, 5.6rem));
      --basket-bottom: clamp(3.5rem, 7.2vh, 4.5rem);
      --basket-width: clamp(7rem, 12vw, 8.4rem);
      --basket-height: clamp(4.8rem, 8vw, 5.8rem);
    }

    .glade {
      position: absolute;
      left: 50%;
      bottom: -4%;
      width: min(90vw, 76rem);
      height: 74%;
      transform: translateX(-50%);
      border-radius: 52% 52% 0 0 / 42% 42% 0 0;
      background:
        radial-gradient(ellipse at 48% 22%, rgba(255, 213, 138, 0.54), rgba(255, 213, 138, 0.12) 32%, transparent 50%),
        radial-gradient(ellipse at 56% 56%, rgba(143, 94, 41, 0.28), transparent 56%),
        linear-gradient(180deg, #325632 0%, #294728 22%, #1e341f 100%);
      box-shadow:
        0 -36px 120px rgba(255, 197, 101, 0.1),
        inset 0 14px 18px rgba(255, 239, 203, 0.08),
        inset 0 -18px 28px rgba(8, 13, 10, 0.2);
      overflow: hidden;
    }

    .glade::before,
    .glade::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .glade::before {
      background:
        radial-gradient(circle at 13% 76%, rgba(255, 196, 153, 0.8) 0 0.32rem, transparent 0.33rem),
        radial-gradient(circle at 18% 73%, rgba(255, 230, 186, 0.9) 0 0.28rem, transparent 0.29rem),
        radial-gradient(circle at 26% 70%, rgba(255, 196, 153, 0.72) 0 0.24rem, transparent 0.25rem),
        radial-gradient(circle at 36% 74%, rgba(255, 222, 156, 0.82) 0 0.3rem, transparent 0.31rem),
        radial-gradient(circle at 72% 66%, rgba(233, 189, 255, 0.52) 0 0.2rem, transparent 0.21rem),
        radial-gradient(circle at 79% 65%, rgba(255, 232, 193, 0.66) 0 0.24rem, transparent 0.25rem),
        radial-gradient(circle at 82% 75%, rgba(255, 192, 148, 0.72) 0 0.26rem, transparent 0.27rem),
        radial-gradient(circle at 87% 71%, rgba(255, 224, 160, 0.88) 0 0.28rem, transparent 0.29rem),
        radial-gradient(ellipse at 66% 72%, rgba(255, 227, 173, 0.16), rgba(255, 227, 173, 0) 18%),
        radial-gradient(ellipse at 50% 64%, rgba(31, 62, 28, 0.32), transparent 48%),
        radial-gradient(ellipse at 50% 80%, rgba(8, 18, 10, 0.22), transparent 56%);
      opacity: 0.95;
    }

    .glade::after {
      background:
        linear-gradient(180deg, rgba(255, 240, 204, 0.08), rgba(255, 240, 204, 0) 22%),
        radial-gradient(ellipse at 48% 40%, rgba(255, 239, 204, 0.12), transparent 42%),
        radial-gradient(ellipse at 66% 78%, rgba(255, 242, 205, 0.18), rgba(255, 242, 205, 0) 22%),
        radial-gradient(ellipse at 56% 66%, rgba(255, 228, 166, 0.16), transparent 24%),
        repeating-linear-gradient(100deg, rgba(73, 114, 56, 0.18), rgba(73, 114, 56, 0.18) 0.12rem, rgba(31, 52, 28, 0.18) 0.14rem, rgba(31, 52, 28, 0.18) 0.36rem);
      mix-blend-mode: soft-light;
      opacity: 0.5;
    }

    .interaction-pool {
      position: absolute;
      left: 50%;
      bottom: clamp(2.6rem, 4.6vh, 3.4rem);
      width: min(40rem, 56vw);
      height: min(14rem, 22vw);
      transform: translateX(-8%);
      border-radius: 50%;
      z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 36% 54%, rgba(255, 223, 165, 0.24), rgba(255, 223, 165, 0.08) 34%, rgba(255, 223, 165, 0) 70%),
        radial-gradient(ellipse at 54% 62%, rgba(255, 246, 216, 0.12), transparent 56%);
      filter: blur(18px);
      mix-blend-mode: screen;
      opacity: 0.9;
    }

    .interaction-pool::before {
      content: "";
      position: absolute;
      inset: 18% 12% 6%;
      border-radius: 50%;
      background: radial-gradient(ellipse at 50% 56%, rgba(34, 63, 27, 0.22), rgba(34, 63, 27, 0) 68%);
      opacity: 0.72;
    }

    .bunny-cluster {
      position: absolute;
      left: 50%;
      bottom: clamp(4.6rem, 9vh, 6.2rem);
      width: min(20rem, 46vw);
      height: min(18rem, 40vw);
      transform: translateX(-50%);
      z-index: 4;
      pointer-events: none;
    }

    .bunny-shadow {
      position: absolute;
      left: 50%;
      bottom: 1rem;
      width: 62%;
      height: 13%;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(10, 11, 10, 0.4), rgba(10, 11, 10, 0.06) 58%, transparent 74%);
      filter: blur(12px);
      opacity: 0.72;
    }

    .bunny {
      position: absolute;
      inset: 0;
      transform-origin: 50% 88%;
    }

    .tail {
      position: absolute;
      left: 65%;
      bottom: 18%;
      width: 18%;
      height: 18%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 34% 34%, rgba(255, 255, 255, 0.96), rgba(249, 243, 235, 0.94) 34%, rgba(219, 202, 187, 0.92) 76%, rgba(178, 154, 137, 0.94) 100%);
      box-shadow:
        inset -0.22rem -0.28rem 0 rgba(145, 118, 102, 0.14),
        inset 0.3rem 0.32rem 0 rgba(255, 255, 255, 0.38),
        0 0.6rem 0.8rem rgba(32, 27, 23, 0.12);
    }

    .body {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 58%;
      height: 54%;
      transform: translateX(-50%);
      border-radius: 46% 46% 42% 42% / 42% 42% 52% 52%;
      background:
        linear-gradient(180deg, #f7f0e8 0%, #eadccf 54%, #ceb5a3 100%);
      box-shadow:

  <script>
    (() => {
      const scene = document.getElementById("scene");
      const canvas = document.getElementById("particle-canvas");

      const clearing = scene.querySelector(".clearing");
      const beamSvg = document.getElementById("magic-beams");

      const bunnyShadow = document.getElementById("bunny-shadow");
      const basket = document.getElementById("basket");
      const basketPocket = document.getElementById("basket-pocket");
      const basketFront = document.getElementById("basket-front");
      const basketRim = document.getElementById("basket-rim");
      const tuftLeft = clearing.querySelector(".tuft-left");
      const tuftRight = clearing.querySelector(".tuft-right");
      const ears = {
        left: bunnyHead.querySelector(".ear-left"),
        right: bunnyHead.querySelector(".ear-right")
      };
      const cheeks = Array.from(bunnyHead.querySelectorAll(".cheek"));
      const whiskers = Array.from(bunnyHead.querySelectorAll(".whisker"));
      const eyes = Array.from(bunnyHead.querySelectorAll(".eye"));
      const irises = Array.from(bunnyHead.querySelectorAll(".iris"));
      const parallaxLayers = Array.from(document.querySelectorAll("[data-depth]"));
      const initialWidth = window.innerWidth;
      const initialHeight = window.innerHeight;
      const butterflies = Array.from(document.querySelectorAll(".butterfly")).map((element) => ({
        element,
        wings: Array.from(element.querySelectorAll(".wing")),
        burst: element.querySelector(".butterfly-burst"),
        centerX: Number(element.dataset.x),
        centerY: Number(element.dataset.y),
        radiusX: Number(element.dataset.rx),
        radiusY: Number(element.dataset.ry),
        speed: Number(element.dataset.speed),
        scale: Number(element.dataset.scale),
        phase: Number(element.dataset.phase),
        baseOpacity: element.classList.contains("butterfly-close") ? 0.72 : 0.92,
        isClose: element.classList.contains("butterfly-close"),
        status: "idle",
        offsetX: 0,
        offsetY: 0,
        currentX: initialWidth * Number(element.dataset.x),
        currentY: initialHeight * Number(element.dataset.y),
        currentScale: Number(element.dataset.scale),
        rotation: 0,
        targetStart: -100000,
        targetDuration: 0,
        burstStart: -100000,
        burstDuration: 0,
        respawnAt: 0,
        revealStart: -100000,
        revealDuration: 0,
        lockX: initialWidth * Number(element.dataset.x),
        lockY: initialHeight * Number(element.dataset.y),
        lockRotation: 0,
        lockScale: Number(element.dataset.scale)
      }));
      const carrots = Array.from(document.querySelectorAll(".carrot"));
      const carrotStates = carrots.map((element, index) => {
        const baseRotation = Number(element.dataset.rotation || 0);
        const baseScale = Number(element.dataset.scale || 1);

        return {
          element,
          slotIndex: index,
          defaultLabel: element.getAttribute("aria-label") || "Guide the carrot into the basket",
          baseRotation,
          baseScale,
          phase: "idle",
          progress: 0,
          originX: 0,
          originY: 0,
          width: 0,
          height: 0,
          x: 0,
          y: 0,
          rotation: baseRotation,
          scale: baseScale,
          fromX: 0,
          fromY: 0,
          fromRotation: baseRotation,
          fromScale: baseScale,
          approachX: 0,
          approachY: 0,
          slotX: 0,
          slotY: 0,
          slotRotation: baseRotation,
          slotScale: baseScale,
          arcHeight: 0,
          arcSway: 0,
          releaseX: 0,
          releaseY: 0,
          releaseRotation: baseRotation,
          releaseScale: baseScale,
          spawn: null,
          spawnTemplateId: "",
          parallax: Number(element.dataset.parallax || 0.1),
          focusHeight: Number(element.dataset.focusHeight || 0.38),
          floatAmount: Number(element.dataset.float || 1),
          floatPhase: Number(element.dataset.phase || index * 1.7),
          start: 0,
          transportDuration: 0,
          dropDuration: 0,
          bounceDuration: 0
        };
      });
      const carrotMap = new Map(carrotStates.map((state) => [state.element, state]));
      const beamPaths = [
        {
          source: irises[0],
          glow: document.getElementById("beam-left-glow"),
          core: document.getElementById("beam-left-core")
        },
        {
          source: irises[1],
          glow: document.getElementById("beam-right-glow"),
          core: document.getElementById("beam-right-core")
        }
      ];
      const reducedMotionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
      const coarsePointerQuery = window.matchMedia("(pointer: coarse)");

      let reducedMotion = reducedMotionQuery.matches;
      let coarsePointer = coarsePointerQuery.matches;
      let width = window.innerWidth;
      let height = window.innerHeight;
      let clearingWidth = 0;
      let clearingHeight = 0;
      let pixelRatio = 1;
      let sceneLeft = 0;
      let sceneTop = 0;
      let lastTime = 0;
      let sparkle = 0;
      let particles = [];

      const pointer = {
        x: width * 0.68,
        y: height * 0.42,
        targetX: width * 0.68,
        targetY: height * 0.42,
        active: false,
        vx: 0,
        vy: 0
      };

      const bunnyAnchor = {
        x: width * 0.5,
        y: height * 0.68
      };

      const headSpringX = { x: 0, v: 0 };
      const headSpringY = { x: 0, v: 0 };
      const headTiltSpring = { x: 0, v: 0 };

      const blink = {
        start: -100000,
        duration: 180,
        next: 0
      };

      const earTwitch = {
        left: {
          start: -100000,
          duration: 320,
          next: 0
        },
        right: {
          start: -100000,
          duration: 340,
          next: 0
        }
      };

      const reaction = {
        mode: "idle",
        start: -100000,
        duration: 900,
        focusX: width * 0.5,
        focusY: height * 0.6
      };

      const idleAttention = {
        start: -100000,
        duration: 1600,
        next: 0,
        lookX: 0,
        lookY: 0,
        tilt: 0,
        lift: 0
      };

      const basketState = {
        x: width * 0.62,
        y: height * 0.74,
        lipX: width * 0.62,
        lipY: height * 0.68,
        width: 80,
        height: 48
      };

        kind: null,

        progress: 0,
        beamVisible: false,
        focusSpace: "clearing",
        focusLocalX: width * 0.5,
        focusLocalY: height * 0.6,

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function lerp(start, end, alpha) {
        return start + (end - start) * alpha;
      }

      function rand(min, max) {
        return Math.random() * (max - min) + min;
      }

      function sampleRange(range) {
        return Array.isArray(range) ? rand(range[0], range[1]) : range;
      }

      function shuffleList(items) {
        const copy = items.slice();

        for (let index = copy.length - 1; index > 0; index -= 1) {
          const swapIndex = Math.floor(rand(0, index + 1));
          const temp = copy[index];
          copy[index] = copy[swapIndex];
          copy[swapIndex] = temp;
        }

        return copy;
      }

      function spring(axis, target, stiffness, damping) {
        axis.v += (target - axis.x) * stiffness;
        axis.v *= damping;
        axis.x += axis.v;
        return axis.x;
      }

      function envelope(start, duration, time) {
        if (time < start || time > start + duration) {
          return 0;
        }

        const progress = (time - start) / duration;
        return Math.sin(progress * Math.PI);
      }

      function easeInOutCubic(value) {
        if (value < 0.5) {
          return 4 * value * value * value;
        }

        return 1 - Math.pow(-2 * value + 2, 3) / 2;
      }

      function easeInQuad(value) {
        return value * value;
      }

      function easeOutCubic(value) {
        return 1 - Math.pow(1 - value, 3);
      }

      function setPointer(clientX, clientY, active) {
        pointer.targetX = clamp(clientX - sceneLeft, 0, width);
        pointer.targetY = clamp(clientY - sceneTop, 0, height);
        pointer.active = active;
      }

      function settlePointer() {
        pointer.targetX = width * 0.68;
        pointer.targetY = height * 0.42;
      }

      function scheduleBlink(time) {
        blink.start = time;
        blink.duration = reducedMotion ? 140 : rand(150, 220);
        blink.next = time + rand(2600, 6200);
      }

      function forceBlink(time) {
        blink.start = time;
        blink.duration = reducedMotion ? 120 : 170;
        blink.next = time + rand(2600, 6200);
      }

      function triggerEarTwitch(side, time) {
        const twitch = earTwitch[side];
        twitch.start = time;
        twitch.duration = rand(240, 420);
        twitch.next = time + rand(3000, 7200);
      }

      function scheduleIdleAttention(time) {
        idleAttention.start = time;
        idleAttention.duration = reducedMotion ? rand(900, 1300) : rand(1300, 2200);
        idleAttention.lookX = rand(-4.8, 4.8);
        idleAttention.lookY = rand(-2.2, 2.2);
        idleAttention.tilt = idleAttention.lookX * 0.18 + rand(-1.4, 1.4);
        idleAttention.lift = rand(-0.8, 1.4);
        idleAttention.next = time + rand(2200, 5200);
      }

      function rebuildParticles() {
        const count = reducedMotion
          ? Math.max(34, Math.round((width * height) / 38000))
          : clamp(Math.round((width * height) / 24000), 56, 110);

        particles = Array.from({ length: count }, () => createParticle(true));
      }

      function createParticle(initial) {
        const depth = rand(0.5, 1.5);
        return {
          depth,
          size: rand(0.8, 2.4) * depth,
          x: rand(0, width),
          y: initial ? rand(0, height) : height + rand(12, 120),
          vx: rand(-0.05, 0.05) * depth,

      function createCarrotSpawn(template) {
        return {
          templateId: template.id,
          centerX: sampleRange(template.centerX),
          bottom: sampleRange(template.bottom),
          size: sampleRange(template.size),
          rotation: sampleRange(template.rotation),

      function carrotSpawnDimensions(spawn) {
        const baseWidth = clamp(clearingWidth * 0.072, 46, 84);
        const baseHeight = clamp(baseWidth * 1.28, 58, 108);
        return {
          width: clamp(baseWidth * spawn.size, 42, 86),
          height: clamp(baseHeight * spawn.size, 54, 112)
        };
      }

      function applyCarrotSpawnStyle(state) {
        if (!state.spawn || !clearingWidth || !clearingHeight) {
          return;
        }

        const dimensions = carrotSpawnDimensions(state.spawn);
        const left = clamp(clearingWidth * state.spawn.centerX - dimensions.width * 0.5, 12, clearingWidth - dimensions.width - 12);
        const bottom = clamp(clearingHeight * state.spawn.bottom, 22, clearingHeight - dimensions.height - 18);
        state.element.style.left = left.toFixed(2) + "px";
        state.element.style.bottom = bottom.toFixed(2) + "px";
        state.element.style.width = dimensions.width.toFixed(2) + "px";
        state.element.style.height = dimensions.height.toFixed(2) + "px";
        state.element.style.setProperty("--world-z", String(state.spawn.zIndex));
        state.element.style.setProperty("--base-rotation", state.spawn.rotation.toFixed(2) + "deg");
        state.element.style.setProperty("--base-scale", state.spawn.scale.toFixed(3));
        state.element.style.setProperty("--wiggle-start", state.spawn.rotation.toFixed(2) + "deg");
        state.element.style.setProperty("--depth-opacity", state.spawn.depthOpacity.toFixed(3));
        state.element.style.setProperty("--carrot-saturate", state.spawn.saturate.toFixed(3));
        state.element.style.setProperty("--carrot-brightness", state.spawn.brightness.toFixed(3));
        state.element.style.setProperty("--carrot-blur", state.spawn.blur.toFixed(2) + "px");
        state.baseRotation = state.spawn.rotation;
        state.baseScale = state.spawn.scale;
        state.parallax = state.spawn.parallax;
        state.focusHeight = state.spawn.focusHeight;
        state.floatAmount = state.spawn.float;
        state.floatPhase = state.spawn.phase;
        state.defaultLabel = state.spawn.label;
      }

      function chooseCarrotReleaseSpawns(states) {
        const occupied = new Set(
          carrotStates
            .filter((state) => !states.includes(state))
            .map((state) => state.spawnTemplateId)
            .filter(Boolean)
        );
        const avoid = new Set(states.map((state) => state.spawnTemplateId).filter(Boolean));
        const preferredPool = carrotSpawnTemplates.filter((template) => !occupied.has(template.id) && !avoid.has(template.id));
        const fallbackPool = carrotSpawnTemplates.filter((template) => !occupied.has(template.id));
        const pool = (preferredPool.length >= states.length ? preferredPool : fallbackPool).filter(Boolean);
        const chosen = shuffleList(pool.length ? pool : carrotSpawnTemplates).slice(0, states.length);
        return chosen.map((template) => createCarrotSpawn(template));
      }

      function createButterflyPath(template) {
        return {
          centerX: sampleRange(template.centerX),
          centerY: sampleRange(template.centerY),
          radiusX: sampleRange(template.radiusX),
          radiusY: sampleRange(template.radiusY),
          speed: sampleRange(template.speed),
          scale: sampleRange(template.scale),
          phase: rand(0, Math.PI * 2),
          baseOpacity: sampleRange(template.opacity)
        };
      }

      function chooseButterflyPath(butterfly) {
        const templates = butterfly.isClose ? butterflySpawnTemplates.close : butterflySpawnTemplates.far;
        const others = butterflies.filter((item) => item !== butterfly && item.status !== "respawning");

        for (let attempt = 0; attempt < 12; attempt += 1) {
          const template = templates[Math.floor(rand(0, templates.length))];
          const candidate = createButterflyPath(template);
          const tooClose = others.some(
            (other) =>
              Math.hypot(candidate.centerX - other.centerX, candidate.centerY - other.centerY) <
              (butterfly.isClose || other.isClose ? 0.2 : 0.14)
          );

          if (!tooClose) {
            return candidate;
          }
        }

        return createButterflyPath(templates[Math.floor(rand(0, templates.length))]);
      }

      function applyButterflyPath(butterfly, path) {
        butterfly.centerX = path.centerX;
        butterfly.centerY = path.centerY;
        butterfly.radiusX = path.radiusX;
        butterfly.radiusY = path.radiusY;
        butterfly.speed = path.speed;
        butterfly.scale = path.scale;
        butterfly.phase = path.phase;
        butterfly.baseOpacity = path.baseOpacity;
        butterfly.offsetX = 0;
        butterfly.offsetY = 0;
        butterfly.currentX = width * butterfly.centerX;
        butterfly.currentY = height * butterfly.centerY;
        butterfly.currentScale = butterfly.scale;
        butterfly.rotation = 0;
      }

      function getCarrotSlot(state) {
        const layouts = {
          1: [
            { x: 0, y: 2, rotation: -4, scale: 0.8 }
          ],
          2: [
            { x: -0.18, y: 5, rotation: -16, scale: 0.76 },
            { x: 0.18, y: -1, rotation: 13, scale: 0.74 }
          ],
          3: [
            { x: -0.24, y: 5, rotation: -18, scale: 0.76 },
            { x: 0.02, y: -4, rotation: -2, scale: 0.7 },
            { x: 0.23, y: 3, rotation: 14, scale: 0.76 }
          ],
          4: [
            { x: -0.28, y: 5, rotation: -19, scale: 0.74 },
            { x: -0.06, y: -4, rotation: -6, scale: 0.68 },
            { x: 0.16, y: 2, rotation: 8, scale: 0.72 },
            { x: 0.32, y: 0, rotation: 17, scale: 0.74 }
          ]
        };
        const layout = layouts[carrotStates.length] || layouts[4];
        const slot = layout[state.slotIndex] || layout[layout.length - 1];

        return {
          x: slot.x * basketState.width,
          y: slot.y,
          rotation: slot.rotation,
          scale: slot.scale
        };
      }

      function syncCarrotTargets(state) {
        const slot = getCarrotSlot(state);
        const launchX = state.fromX || state.originX;

        state.slotX = basketState.x - state.width * 0.5 + slot.x;
        state.slotY = basketState.y - state.height * 0.64 + slot.y;
        state.approachX = basketState.lipX - state.width * 0.5 + slot.x * 0.42;
        state.approachY = basketState.lipY - state.height * 0.72 + slot.y * 0.08;
        state.slotRotation = slot.rotation;
        state.slotScale = slot.scale * 0.92;
        state.arcHeight = clamp(Math.abs(state.approachX - launchX) * 0.24 + basketState.height * 1.04, 36, reducedMotion ? 70 : 112);
        state.arcSway = slot.x * 0.18;
      }

      function carrotFocusPoint(state, heightRatio = state.focusHeight || 0.38) {
        return {
          x: state.x + state.width * 0.5,
          y: state.y + state.height * heightRatio

      }

      function renderCarrot(state) {
        if (state.phase === "idle" || state.phase === "queued") {
          state.element.style.transform = "";
          return;
        }

        const dx = state.x - state.originX;
        const dy = state.y - state.originY;
        state.element.style.transform =
          "translate3d(" +
          dx.toFixed(2) +
          "px, " +
          dy.toFixed(2) +
          "px, 0) rotate(" +
          state.rotation.toFixed(2) +
          "deg) scale(" +
          state.scale.toFixed(3) +
          ")";
      }

      function hasCarrotReleaseInFlight() {
        return carrotStates.some((state) => state.phase === "release");
      }

      function interactionsLocked() {
        return collection.phase !== "idle" || basketReset.active || hasCarrotReleaseInFlight();
      }

      function restoreCarrotToClearing(state) {
        state.phase = "idle";
        state.progress = 0;
        state.x = state.originX;
        state.y = state.originY;
        state.rotation = state.baseRotation;
        state.scale = state.baseScale;
        state.element.classList.remove("is-collecting", "is-dropping", "is-collected", "is-queued", "is-releasing");
        state.element.removeAttribute("aria-disabled");
        state.element.setAttribute("aria-label", state.defaultLabel);
        state.element.tabIndex = 0;
        renderCarrot(state);
      }

      function beginCarrotRelease(state, spawn, time, index) {
        state.spawn = spawn;
        state.spawnTemplateId = spawn.templateId;
        state.fromX = state.x;
        state.fromY = state.y;
        state.fromRotation = state.rotation;
        state.fromScale = state.scale;
        applyCarrotSpawnStyle(state);
        state.originX = state.element.offsetLeft;
        state.originY = state.element.offsetTop;
        state.width = state.element.offsetWidth;
        state.height = state.element.offsetHeight;
        state.releaseX = state.originX;
        state.releaseY = state.originY;
        state.releaseRotation = state.baseRotation;
        state.releaseScale = state.baseScale;
        state.arcHeight = clamp(Math.abs(state.releaseX - state.fromX) * 0.18 + basketState.height * 0.92, 28, reducedMotion ? 58 : 96);
        state.arcSway = clamp((state.releaseX - basketState.x) * 0.08, -18, 18);
        state.transportDuration = reducedMotion ? 380 : 760;
        state.phase = "release";
        state.progress = 0;
        state.start = time + index * (reducedMotion ? 24 : 60);
        state.element.classList.remove("is-collected", "is-dropping", "is-queued", "is-triggered");
        state.element.classList.add("is-releasing");
        state.element.setAttribute("aria-disabled", "true");
        state.element.tabIndex = -1;
        if (document.activeElement === state.element) {
          state.element.blur();
        }
        renderCarrot(state);
      }

      function updateReleasePhase(state, time) {
        if (time < state.start) {
          renderCarrot(state);
          return;
        }

        const raw = clamp((time - state.start) / state.transportDuration, 0, 1);
        const eased = reducedMotion ? raw : easeInOutCubic(raw);
        const arcWave = Math.sin(raw * Math.PI);
        state.progress = raw;
        state.x = lerp(state.fromX, state.releaseX, eased) + arcWave * state.arcSway;
        state.y = lerp(state.fromY, state.releaseY, eased) - arcWave * state.arcHeight;
        state.rotation = lerp(state.fromRotation, state.releaseRotation, eased) + Math.sin(raw * Math.PI * 2.1) * (reducedMotion ? 1.2 : 4.2);
        state.scale = lerp(state.fromScale, state.releaseScale, eased) * (1 + arcWave * (reducedMotion ? 0.01 : 0.04));
        renderCarrot(state);

        if (raw >= 1) {
          restoreCarrotToClearing(state);
          state.element.classList.remove("is-triggered");
          void state.element.offsetWidth;
          state.element.classList.add("is-triggered");
          sparkle = 1;
        }
      }

      function butterflyFocusScene(butterfly) {
        const rect = butterfly.element.getBoundingClientRect();
        return {
          x: rect.left - sceneLeft + rect.width * 0.5,
          y: rect.top - sceneTop + rect.height * 0.44

      function setButterflySparkle(butterfly, vanish, burst) {
        butterfly.element.style.setProperty("--butterfly-vanish", vanish.toFixed(3));
