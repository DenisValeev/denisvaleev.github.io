<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Slang</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      --accent: #6d61ff;
      --accent-soft: rgba(109, 97, 255, 0.12);
      --accent-border: rgba(109, 97, 255, 0.24);
    }

    body {
      margin: 0;
      padding: 32px 16px 48px;
      background-color: #f6f7ff;
      color: #1e293b;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #0b1020;
        color: #e2e8f0;
      }

      table {
        background: rgba(255, 255, 255, 0.04);
      }

      th,
      td,
      table {
        border-color: rgba(226, 232, 240, 0.2);
      }

      .definition-row td {
        background: rgba(148, 163, 209, 0.12);
      }

      .example-row td {
        background: rgba(109, 97, 255, 0.16);
      }

      .hint-row td {
        background: rgba(148, 163, 209, 0.22);
      }

      .hint-label {
        color: rgba(181, 187, 255, 0.9);
      }

      .filter input[type="search"] {
        background: rgba(15, 23, 42, 0.92);
        border-color: rgba(148, 163, 209, 0.4);
        color: inherit;
      }

      .category-picker select {
        background: rgba(15, 23, 42, 0.92);
        border-color: rgba(148, 163, 209, 0.4);
        color: inherit;
      }

      .category-badge {
        background: rgba(158, 166, 255, 0.18);
        border-color: rgba(158, 166, 255, 0.35);
        color: rgba(226, 232, 255, 0.95);
      }
    }

    main {
      max-width: 960px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 0.25rem;
      font-size: clamp(1.8rem, 2vw + 1.2rem, 2.4rem);
    }

    p {
      margin: 0 0 1rem;
      line-height: 1.6;
    }

    .count {
      font-weight: 600;
    }

    .filters {
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    @media (min-width: 720px) {
      .filters {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }

    .category-picker {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .category-picker select {
      border-radius: 999px;
      border: 1px solid rgba(109, 97, 255, 0.32);
      padding: 10px 18px;
      font: inherit;
      background: rgba(255, 255, 255, 0.92);
      color: inherit;
      cursor: pointer;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      min-width: 220px;
    }

    .category-picker select:focus-visible {
      outline: 2px solid rgba(109, 97, 255, 0.55);
      outline-offset: 3px;
      box-shadow: 0 0 0 3px rgba(109, 97, 255, 0.18);
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .filter {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      flex: 1;
    }

    .filter label {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .filter input[type="search"] {
      width: 100%;
      box-sizing: border-box;
      border-radius: 12px;
      border: 1px solid rgba(15, 23, 42, 0.2);
      background: rgba(255, 255, 255, 0.96);
      color: inherit;
      padding: 10px 14px;
      font: inherit;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .filter input[type="search"]:focus-visible {
      outline: 2px solid rgba(109, 97, 255, 0.45);
      outline-offset: 2px;
      box-shadow: 0 0 0 3px rgba(109, 97, 255, 0.18);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1.5rem;
      border: 1px solid rgba(15, 23, 42, 0.15);
      background: rgba(255, 255, 255, 0.92);
    }

    td,
    th {
      padding: 12px 14px;
      border: 1px solid rgba(15, 23, 42, 0.15);
      vertical-align: top;
      text-align: left;
    }

    .term-cell,
    .definition-cell {
      white-space: pre-wrap;
    }

    .term-cell {
      font-size: clamp(1.05rem, 0.4vw + 1rem, 1.2rem);
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .category-badge {
      display: inline-flex;
      align-items: center;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 700;
      white-space: nowrap;
    }

    .definition-row td {
      font-style: italic;
      background: rgba(109, 97, 255, 0.08);
    }

    .example-row td {
      background: rgba(109, 97, 255, 0.05);
    }

    .example-cell {
      white-space: pre-wrap;
    }

    .example-cell blockquote {
      margin: 0;
      padding-left: 28px;
      font-style: normal;
      position: relative;
    }

    .example-cell blockquote::before {
      content: '“';
      position: absolute;
      left: 0;
      top: -10px;
      font-size: 2.4rem;
      color: rgba(109, 97, 255, 0.4);
      font-family: "Times New Roman", serif;
    }

    .hint-row td {
      background: rgba(109, 97, 255, 0.08);
    }

    .hint-cell {
      display: grid;
      gap: 6px;
      white-space: pre-wrap;
    }

    .hint-label {
      font-size: 0.7rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 700;
      color: rgba(109, 97, 255, 0.82);
    }

    .hint-text {
      font-size: clamp(0.95rem, 0.6vw + 0.9rem, 1.05rem);
      line-height: 1.6;
    }

    caption {
      text-align: left;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>All Slang</h1>
    <p>Browse every term, filter by category, and jump into shuffle mode when you want to drill the definitions.</p>
    <p class="count">Showing <span data-count>0</span> of <span data-total>0</span> terms</p>
    <div class="filters">
      <label class="category-picker" for="category-select">
        <span class="visually-hidden">Select slang category</span>
        <select id="category-select" aria-label="Slang category" data-category-select></select>
      </label>
      <form class="filter" data-filter-form>
        <label for="slang-filter">Filter slang terms</label>
        <input id="slang-filter" type="search" name="slang-filter" placeholder="Type to filter…" autocomplete="off" data-filter-input>
      </form>
    </div>
    <table>
      <caption>Slang term, category, meaning, usage example, and usage hint</caption>
      <tbody>
        <tr>
          <td>Loading slang…</td>
        </tr>
      </tbody>
    </table>
  </main>
  <script src="slang.js" defer></script>
  <script src="render-all.js" defer></script>
</body>
</html>
