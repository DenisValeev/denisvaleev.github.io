<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slang</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      --background-color: #f4f5ff;
      --background-gradient: radial-gradient(circle at top, rgba(123, 97, 255, 0.18), transparent 65%);
      --card-background: rgba(255, 255, 255, 0.9);
      --card-border: rgba(16, 24, 56, 0.06);
      --card-shadow: 0 28px 56px -28px rgba(16, 24, 56, 0.32);
      --text-primary: #0f172a;
      --text-secondary: rgba(15, 23, 42, 0.7);
      --meaning-color: #334155;
      --accent: #6d61ff;
      --accent-soft: rgba(109, 97, 255, 0.12);
      --accent-contrast: #ffffff;
      --category-background: rgba(109, 97, 255, 0.12);
      --category-border: rgba(109, 97, 255, 0.24);
      background: var(--background-gradient);
      background-color: var(--background-color);
      color: var(--text-primary);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background-color: #0b1023;
        --background-gradient: radial-gradient(circle at top, rgba(109, 97, 255, 0.28), rgba(6, 10, 26, 0.92) 60%);
        --card-background: rgba(14, 20, 40, 0.92);
        --card-border: rgba(148, 163, 209, 0.1);
        --card-shadow: 0 34px 68px -30px rgba(0, 0, 0, 0.6);
        --text-primary: #e2e8ff;
        --text-secondary: rgba(226, 232, 255, 0.74);
        --meaning-color: rgba(226, 232, 255, 0.86);
        --accent: #9ea6ff;
        --accent-soft: rgba(158, 166, 255, 0.16);
        --accent-contrast: #0b1023;
        --category-background: rgba(158, 166, 255, 0.18);
        --category-border: rgba(158, 166, 255, 0.35);
      }
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(20px, 6vw, 40px);
    }

    main {
      max-width: 760px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: clamp(22px, 4vw, 40px);
    }

    .app-header {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .app-header h1 {
      margin: 0;
      font-size: clamp(1.9rem, 2.4vw + 1.2rem, 2.6rem);
      font-weight: 700;
    }

    .app-header p {
      margin: 0;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .filters {
      display: flex;
      justify-content: flex-start;
    }

    .category-picker {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .category-picker select {
      border-radius: 999px;
      border: 1px solid rgba(109, 97, 255, 0.32);
      padding: 10px 18px;
      font-size: 1rem;
      background: rgba(255, 255, 255, 0.88);
      color: inherit;
      cursor: pointer;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      min-width: 220px;
    }

    .category-picker select:focus-visible {
      outline: 2px solid rgba(109, 97, 255, 0.6);
      outline-offset: 3px;
      box-shadow: 0 0 0 3px rgba(109, 97, 255, 0.2);
    }

    @media (prefers-color-scheme: dark) {
      .category-picker select {
        background: rgba(14, 20, 40, 0.92);
        border-color: rgba(158, 166, 255, 0.4);
      }
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .card {
      background: var(--card-background);
      border-radius: 22px;
      border: 1px solid var(--card-border);
      box-shadow: var(--card-shadow);
      backdrop-filter: blur(16px);
      padding: clamp(28px, 6vw, 44px);
      display: flex;
      flex-direction: column;
      gap: 20px;
      min-height: 260px;
    }

    .card__content {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .home-nav {
      display: flex;
      justify-content: flex-start;
    }

    .home-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid var(--accent);
      text-decoration: none;
      color: var(--accent);
      font-weight: 600;
      background: transparent;
      transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
    }

    .home-link span[aria-hidden="true"] {
      font-size: 1.1rem;
    }

    .home-link:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 28px rgba(109, 97, 255, 0.22);
      background: var(--accent-soft);
    }

    .home-link:focus-visible {
      outline: 2px solid rgba(109, 97, 255, 0.35);
      outline-offset: 3px;
      box-shadow: 0 0 0 3px rgba(109, 97, 255, 0.18);
    }

    .term {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .term__label {
      margin: 0;
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-secondary);
      font-weight: 600;
    }

    .term__category {
      margin: 0;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--category-background);
      border: 1px solid var(--category-border);
      width: fit-content;
    }

    #slang-term {
      margin: 0;
      font-size: clamp(1.6rem, 2.7vw + 1.1rem, 2.4rem);
      line-height: 1.3;
      font-weight: 700;
    }

    #slang-meaning {
      margin: 0;
      font-size: clamp(1.1rem, 1.9vw + 0.9rem, 1.65rem);
      line-height: 1.6;
      color: var(--meaning-color);
      display: none;
    }

    #slang-meaning.is-visible {
      display: block;
    }

    .card__example {
      margin: 0;
      display: none;
      padding: 18px 20px;
      border-radius: 18px;
      border: 1px solid rgba(109, 97, 255, 0.18);
      background: rgba(109, 97, 255, 0.1);
      color: var(--meaning-color);
    }

    .card__example.is-visible {
      display: block;
    }

    .card__quote {
      margin: 0;
      font-size: clamp(1rem, 1.6vw + 0.85rem, 1.35rem);
      line-height: 1.7;
      position: relative;
      padding-left: 28px;
    }

    .card__quote::before {
      content: '“';
      position: absolute;
      left: 0;
      top: -10px;
      font-size: 2.5rem;
      color: rgba(109, 97, 255, 0.5);
      font-family: "Times New Roman", serif;
    }

    .card__hint {
      margin: 0;
      display: grid;
      gap: 6px;
      color: var(--meaning-color);
    }

    .card__hint-label {
      font-size: 0.7rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 700;
      color: rgba(109, 97, 255, 0.85);
    }

    .card__hint-text {
      font-size: clamp(0.95rem, 1.2vw + 0.8rem, 1.1rem);
      line-height: 1.6;
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .controls__nav {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      width: 100%;
    }

    .controls__meaning {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 12px 22px;
      font-size: 1rem;
      cursor: pointer;
      background: var(--accent);
      color: var(--accent-contrast);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      touch-action: manipulation;
    }

    button.secondary {
      background: transparent;
      color: var(--accent);
      border: 1px solid currentColor;
      box-shadow: none;
    }

    @media (prefers-color-scheme: dark) {
      button.secondary {
        color: #b5bbff;
        border-color: rgba(181, 187, 255, 0.55);
        background: rgba(158, 166, 255, 0.14);
      }

      button.ghost {
        border-color: rgba(181, 187, 255, 0.38);
        color: #b5bbff;
      }

      .card__example {
        background: rgba(158, 166, 255, 0.18);
        border-color: rgba(181, 187, 255, 0.35);
        color: rgba(226, 232, 255, 0.92);
      }

      .card__quote::before {
        color: rgba(158, 166, 255, 0.55);
      }

      .card__hint-label {
        color: rgba(181, 187, 255, 0.9);
      }
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    button:not(:disabled):hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 26px rgba(109, 97, 255, 0.28);
    }

    button:focus-visible {
      outline: 2px solid rgba(109, 97, 255, 0.6);
      outline-offset: 3px;
    }

    @media (hover: none) and (pointer: coarse) {
      button:not(:disabled) {
        transition: none;
      }

      button:not(:disabled):hover,
      button:not(:disabled):active,
      button:not(:disabled):focus {
        transform: none;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <main aria-label="Slang navigator">
    <nav class="home-nav" aria-label="Home navigation">
      <a class="home-link" href="../../">
        <span aria-hidden="true">←</span>
        <span>Home</span>
      </a>
    </nav>
    <header class="app-header">
      <h1>Slang</h1>
      <p>Shuffle through Gen Alpha and Gen Z slang, switch between generations, and reveal the meaning, a usage example, and a hint for when to drop it.</p>
    </header>
    <div class="filters">
      <label class="category-picker" for="category-select">
        <span class="visually-hidden">Select slang generation</span>
        <select id="category-select" aria-label="Slang generation"></select>
      </label>
    </div>
    <article class="card" aria-live="polite">
      <div class="card__content">
        <div class="term">
          <p class="term__label">Term of the moment</p>
          <p id="slang-category" class="term__category" aria-live="polite">Loading…</p>
          <p id="slang-term">Loading slang…</p>
        </div>
        <p id="slang-meaning" aria-hidden="true"></p>
        <figure id="slang-example-wrapper" class="card__example" aria-hidden="true" hidden>
          <blockquote id="slang-example" class="card__quote"></blockquote>
        </figure>
        <div id="slang-hint-wrapper" class="card__hint" aria-hidden="true" hidden>
          <span class="card__hint-label">Usage hint</span>
          <span id="slang-hint" class="card__hint-text"></span>
        </div>
      </div>
    </article>
    <div class="controls">
      <div class="controls__nav">
        <button id="prev-button" type="button" aria-label="Show previous slang term">⟵ Previous</button>
        <button id="next-button" type="button" aria-label="Show next slang term">Next ⟶</button>
      </div>
      <div class="controls__meaning">
        <button id="reveal-button" class="secondary" type="button" aria-pressed="false">Meaning, example &amp; hint</button>
      </div>
    </div>
  </main>
  <script src="slang.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
