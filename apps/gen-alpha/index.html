<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gen α Slang (moved)</title>
  <meta http-equiv="refresh" content="0; url=../slang/">
  <style>
    :root {
      color-scheme: light dark;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f4f5ff;
      color: #0f172a;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #0b1023;
        color: #e2e8ff;
      }
    }

    main {
      max-width: 480px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    a {
      color: #6d61ff;
      font-weight: 600;
    }

    @media (prefers-color-scheme: dark) {
      a {
        color: #a0a6ff;
      }
    }
  </style>
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      const target = '../slang/';
      if (typeof window.location.replace === 'function') {
        window.location.replace(target);
      } else {
        window.location.href = target;
      }
    });
  </script>
</head>
<body>
  <main>
    <h1>We moved!</h1>
    <p>The Gen α Slang deck now lives at <a href="../slang/">Slang</a>.</p>
    <p>If you are not redirected automatically, use the link above to continue.</p>
  </main>
</body>
</html>
