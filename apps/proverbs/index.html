<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proverbs Explorer</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      background-color: #f5f5f5;
      color: #1f1f1f;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        background-color: #1f1f1f;
        color: #f5f5f5;
      }
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: radial-gradient(circle at top, rgba(88, 140, 200, 0.25), transparent 60%);
    }

    main {
      max-width: 720px;
      width: 100%;
    }

    h1 {
      margin-top: 0;
      font-weight: 600;
      text-align: center;
      letter-spacing: 0.02em;
    }

    p.description {
      text-align: center;
      margin-bottom: 24px;
      color: inherit;
      opacity: 0.85;
    }

    .card {
      background: rgba(255, 255, 255, 0.85);
      color: inherit;
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 24px 48px -24px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(12px);
      min-height: 200px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 18px;
    }

    .card blockquote {
      margin: 0;
      font-size: clamp(1.25rem, 2.2vw + 1rem, 2rem);
      line-height: 1.4;
      font-weight: 500;
    }

    .card cite {
      font-size: 1rem;
      font-style: normal;
      color: inherit;
      opacity: 0.7;
      align-self: flex-end;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-top: 28px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 12px 20px;
      font-size: 1rem;
      cursor: pointer;
      background: #3056d3;
      color: #ffffff;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    button:not(:disabled):hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(48, 86, 211, 0.35);
    }

    button.secondary {
      background: #586380;
    }

    .position {
      font-variant-numeric: tabular-nums;
      opacity: 0.7;
      min-width: 120px;
      text-align: center;
    }

    footer {
      margin-top: 24px;
      text-align: center;
      font-size: 0.85rem;
      opacity: 0.7;
    }

    a {
      color: inherit;
    }
  </style>
</head>
<body>
  <main>
    <h1>Proverbs Explorer</h1>
    <p class="description">Shuffle through wisdom from around the world. Use the buttons or your keyboard arrows to navigate.</p>
    <div class="card" role="group" aria-live="polite">
      <blockquote id="proverb-text">Loading proverb…</blockquote>
      <cite id="proverb-source"></cite>
    </div>
    <div class="controls">
      <button id="prev-button" type="button" aria-label="Show previous proverb">⟵ Previous</button>
      <span class="position" id="proverb-position"></span>
      <button id="next-button" type="button" aria-label="Show next proverb">Next ⟶</button>
      <button id="reshuffle-button" type="button" class="secondary" aria-label="Reshuffle proverbs">Reshuffle</button>
    </div>
    <footer>
      Data source: <a href="https://github.com/increpare/ML_Satz" target="_blank" rel="noopener noreferrer">ML_Satz merged collection</a>.
    </footer>
  </main>
  <script src="proverbs-data.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
