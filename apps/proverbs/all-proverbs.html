<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Proverbs</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 32px 16px 48px;
      background-color: #f7f7f7;
      color: #202020;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #121212;
        color: #f1f5ff;
      }

      table {
        background: rgba(255, 255, 255, 0.04);
      }

      th,
      td,
      table {
        border-color: rgba(255, 255, 255, 0.2);
      }
    }

    main {
      max-width: 960px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 0.25rem;
      font-size: clamp(1.8rem, 2vw + 1.2rem, 2.4rem);
    }

    p {
      margin: 0 0 1rem;
      line-height: 1.6;
    }

    .count {
      font-weight: 600;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1.5rem;
      border: 1px solid rgba(0, 0, 0, 0.15);
      background: rgba(255, 255, 255, 0.9);
    }

    th,
    td {
      padding: 12px 14px;
      border: 1px solid rgba(0, 0, 0, 0.15);
      vertical-align: top;
      text-align: left;
    }

    th {
      width: 3.5rem;
      text-align: right;
      font-weight: 600;
    }

    .index-cell {
      white-space: nowrap;
    }

    .text-cell {
      white-space: pre-wrap;
    }

    caption {
      text-align: left;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>All Proverbs</h1>
    <p>Browse the shuffled list of proverbs pulled from the dataset.</p>
    <p class="count"><span data-count>0</span> proverbs</p>
    <table>
      <caption>Complete list of proverbs</caption>
      <tbody>
        <tr>
          <td colspan="2">Loading proverbs…</td>
        </tr>
      </tbody>
    </table>
  </main>
  <script src="proverbs-data.js" defer></script>
  <script src="render-all.js" defer></script>
</body>
</html>
