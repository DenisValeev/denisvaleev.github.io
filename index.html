<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toolbox</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      --body-base: #f5f7ff;
      --body-gradient: radial-gradient(circle at top, rgba(85, 112, 225, 0.16), rgba(15, 21, 40, 0.08) 55%);
      --text-primary: #10172a;
      --text-secondary: rgba(16, 23, 42, 0.65);
      --surface: rgba(255, 255, 255, 0.94);
      --surface-shadow: 0 28px 70px rgba(15, 23, 42, 0.14);
      --surface-border: rgba(15, 23, 42, 0.08);
      --row-background: rgba(255, 255, 255, 0.86);
      --row-border: rgba(74, 99, 255, 0.22);
      --row-hover: rgba(255, 255, 255, 0.94);
      --row-shadow: 0 18px 36px rgba(15, 23, 42, 0.12);
      --row-shadow-hover: 0 24px 42px rgba(15, 23, 42, 0.18);
      --label-pill: rgba(74, 99, 255, 0.14);
      --label-text: #10172a;
      --button-primary-background: linear-gradient(135deg, #4a63ff, #7687ff);
      --button-primary-text: #0b1020;
      --button-secondary-background: rgba(16, 23, 42, 0.08);
      --button-secondary-hover: rgba(16, 23, 42, 0.14);
      --button-secondary-text: #12172b;
      --button-border: rgba(16, 23, 42, 0.12);
      --button-shadow: 0 10px 24px rgba(15, 23, 42, 0.12);
      --button-shadow-hover: 0 14px 28px rgba(15, 23, 42, 0.16);
      --focus-ring: rgba(121, 134, 255, 0.38);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --body-base: #090d18;
        --body-gradient: radial-gradient(circle at top, rgba(72, 101, 216, 0.28), rgba(9, 17, 35, 0.92) 60%);
        --text-primary: #f5f7ff;
        --text-secondary: rgba(245, 247, 255, 0.7);
        --surface: rgba(12, 17, 31, 0.85);
        --surface-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
        --surface-border: rgba(255, 255, 255, 0.04);
        --row-background: rgba(255, 255, 255, 0.08);
        --row-border: rgba(155, 169, 255, 0.26);
        --row-hover: rgba(255, 255, 255, 0.12);
        --row-shadow: 0 20px 42px rgba(0, 0, 0, 0.32);
        --row-shadow-hover: 0 28px 56px rgba(0, 0, 0, 0.4);
        --label-pill: rgba(155, 169, 255, 0.18);
        --label-text: #f5f7ff;
        --button-primary-background: linear-gradient(135deg, #7f8dff, #a7b5ff);
        --button-primary-text: #050914;
        --button-secondary-background: rgba(245, 247, 255, 0.12);
        --button-secondary-hover: rgba(245, 247, 255, 0.18);
        --button-secondary-text: #f5f7ff;
        --button-border: rgba(245, 247, 255, 0.22);
        --button-shadow: 0 14px 30px rgba(0, 0, 0, 0.32);
        --button-shadow-hover: 0 18px 36px rgba(0, 0, 0, 0.38);
        --focus-ring: rgba(155, 169, 255, 0.52);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--body-gradient);
      background-color: var(--body-base);
      padding: clamp(14px, 2.8vw, 32px);
      color: var(--text-primary);
    }

    main {
      width: min(960px, 100%);
      background: var(--surface);
      border-radius: 26px;
      box-shadow: var(--surface-shadow);
      backdrop-filter: blur(14px);
      border: 1px solid var(--surface-border);
      padding: clamp(14px, 2vw, 24px) clamp(18px, 2.8vw, 32px) clamp(18px, 2.8vw, 32px);
      display: flex;
      flex-direction: column;
      gap: clamp(18px, 3vw, 32px);
    }

    header.site-header {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid rgba(74, 99, 255, 0.12);
    }

    header.site-header h1 {
      margin: 0;
      font-size: clamp(1.8rem, 2vw + 1.4rem, 2.6rem);
      font-weight: 700;
    }

    .section-title {
      margin: 0;
      font-size: clamp(0.95rem, 0.4vw + 0.9rem, 1.1rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .app-groups {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .app-groups__list,
    .tool-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .app-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: clamp(12px, 1vw + 8px, 18px);
      padding: clamp(8px, 1vw + 6px, 14px) 0;
      border-bottom: 1px solid rgba(74, 99, 255, 0.12);
    }

    .app-row:last-child {
      border-bottom: none;
    }

    .app-row__actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: flex-start;
    }

    a.app-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 0.01em;
      border: 1px solid var(--button-border);
      color: var(--button-secondary-text);
      background: var(--button-secondary-background);
      box-shadow: var(--button-shadow);
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
    }

    a.app-button span[aria-hidden="true"] {
      font-size: 1.1rem;
    }

    a.app-button:hover {
      transform: translateY(-1px);
      box-shadow: var(--button-shadow-hover);
    }

    a.app-button:focus-visible {
      outline: none;
      transform: translateY(-1px);
      box-shadow: 0 0 0 3px var(--focus-ring), var(--button-shadow-hover);
    }

    a.app-button--primary {
      background: var(--button-primary-background);
      color: var(--button-primary-text);
      border-color: transparent;
    }

    a.app-button--primary:hover,
    a.app-button--primary:focus-visible {
      background: linear-gradient(135deg, #6377ff, #8f9fff);
    }

    a.app-button--secondary:hover,
    a.app-button--secondary:focus-visible {
      background: var(--button-secondary-hover);
    }

    .tool-list li {
      margin: 0;
    }

    a.app-button--wide {
      width: 100%;
      justify-content: flex-start;
      font-size: clamp(1rem, 0.35vw + 0.95rem, 1.12rem);
      padding: clamp(12px, 2vw + 8px, 18px) clamp(16px, 2vw + 12px, 24px);
    }

    @media (max-width: 720px) {
      .app-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }

      .app-row__actions {
        width: 100%;
        justify-content: flex-start;
      }

      .app-row__actions a.app-button {
        flex: 1 1 auto;
      }
    }
  </style>
</head>
<body>
  <main aria-label="Apps">
    <header class="site-header">
      <h1>Toolbox</h1>
    </header>
    <section class="app-groups" aria-labelledby="deck-section">
      <h2 id="deck-section" class="section-title">Deck collections</h2>
      <ul class="app-groups__list">
        <li class="app-row" data-group="jokes" role="group" aria-label="Jokes">
          <div class="app-row__actions">
            <a class="app-button app-button--secondary" href="apps/jokes/">
              <span aria-hidden="true">😂</span>
              <span>Dad Jokes</span>
            </a>
            <a class="app-button app-button--secondary" href="apps/jokes/all-jokes.html">
              <span>All Jokes</span>
            </a>
          </div>
        </li>
        <li class="app-row" data-group="quotes" role="group" aria-label="Quotes">
          <div class="app-row__actions">
            <a class="app-button app-button--secondary" href="apps/quotes/">
              <span aria-hidden="true">💬</span>
              <span>Quotes</span>
            </a>
            <a class="app-button app-button--secondary" href="apps/quotes/all-quotes.html">
              <span>All Quotes</span>
            </a>
          </div>
        </li>
        <li class="app-row" data-group="slang" role="group" aria-label="Slang">
          <div class="app-row__actions">
            <a class="app-button app-button--secondary" href="apps/slang/">
              <span aria-hidden="true">🗣️</span>
              <span>Slang</span>
            </a>
            <a class="app-button app-button--secondary" href="apps/slang/all-slang.html">
              <span>All Slang</span>
            </a>
          </div>
        </li>
      </ul>
    </section>
    <section class="app-groups" aria-labelledby="tools-section">
      <h2 id="tools-section" class="section-title">Labs &amp; tools</h2>
      <ul class="tool-list">
        <li>
          <a class="app-button app-button--secondary app-button--wide" href="apps/similarity-report/">
            <span aria-hidden="true">🧪</span>
            <span>Cosine Similarity Lab</span>
          </a>
        </li>
        <li>
          <a class="app-button app-button--secondary app-button--wide" href="apps/embedding-explorer/">
            <span aria-hidden="true">🧬</span>
            <span>Embedding Explorer</span>
          </a>
        </li>
        <li>
          <a class="app-button app-button--secondary app-button--wide" href="apps/asset-observatory/">
            <span aria-hidden="true">📊</span>
            <span>Asset Observatory</span>
          </a>
        </li>
        <li>
          <a class="app-button app-button--wide" href="apps/value-formatter/">
            <span aria-hidden="true">🧰</span>
            <span>Value Formatter</span>
          </a>
        </li>
      </ul>
    </section>
  </main>
</body>
</html>
