<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toolbox</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      --body-base: #f5f7ff;
      --body-gradient: radial-gradient(circle at top, rgba(85, 112, 225, 0.16), rgba(15, 21, 40, 0.08) 55%);
      --text-primary: #10172a;
      --text-secondary: rgba(16, 23, 42, 0.65);
      --surface: rgba(255, 255, 255, 0.94);
      --surface-shadow: 0 28px 70px rgba(15, 23, 42, 0.14);
      --surface-border: rgba(15, 23, 42, 0.08);
      --card-background: rgba(255, 255, 255, 0.88);
      --card-hover-background: rgba(255, 255, 255, 0.96);
      --card-shadow: 0 18px 36px rgba(15, 23, 42, 0.12);
      --card-hover-shadow: 0 26px 52px rgba(15, 23, 42, 0.16);
      --accent: #4a63ff;
      --accent-contrast: #0b1020;
      --dev-link-background: rgba(74, 99, 255, 0.12);
      --dev-link-hover: rgba(74, 99, 255, 0.18);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --body-base: #090d18;
        --body-gradient: radial-gradient(circle at top, rgba(72, 101, 216, 0.28), rgba(9, 17, 35, 0.92) 60%);
        --text-primary: #f5f7ff;
        --text-secondary: rgba(245, 247, 255, 0.7);
        --surface: rgba(12, 17, 31, 0.85);
        --surface-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
        --surface-border: rgba(255, 255, 255, 0.04);
        --card-background: rgba(255, 255, 255, 0.06);
        --card-hover-background: rgba(255, 255, 255, 0.1);
        --card-shadow: 0 20px 40px rgba(12, 18, 40, 0.3);
        --card-hover-shadow: 0 28px 54px rgba(12, 18, 40, 0.38);
        --accent: #9ba9ff;
        --accent-contrast: #0a1020;
        --dev-link-background: rgba(255, 255, 255, 0.08);
        --dev-link-hover: rgba(255, 255, 255, 0.12);
      }
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--body-gradient);
      background-color: var(--body-base);
      padding: clamp(12px, 2.5vw, 28px);
      color: var(--text-primary);
    }

    main {
      width: min(960px, 100%);
      background: var(--surface);
      border-radius: 26px;
      box-shadow: var(--surface-shadow);
      backdrop-filter: blur(14px);
      border: 1px solid var(--surface-border);
      padding: clamp(12px, 2vw, 24px) clamp(16px, 2.5vw, 30px) clamp(16px, 2.5vw, 30px);
      display: flex;
      flex-direction: column;
      gap: clamp(14px, 2.5vw, 22px);
    }

    header.site-header {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    header.site-header h1 {
      margin: 0;
      font-size: clamp(1.8rem, 2vw + 1.4rem, 2.6rem);
      font-weight: 700;
    }

    header.site-header p {
      margin: 0;
      color: var(--text-secondary);
      font-size: 1rem;
      line-height: 1.5;
    }

    ul.apps {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 24px;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }

    ul.apps li {
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    a.app-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 18px 22px;
      border-radius: 999px;
      background: var(--card-background);
      text-decoration: none;
      color: inherit;
      box-shadow: var(--card-shadow);
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease, border-color 0.18s ease;
      border: 1px solid transparent;
      font-size: 1.1rem;
      font-weight: 600;
    }

    a.app-button:hover,
    a.app-button:focus-visible {
      transform: translateY(-6px);
      box-shadow: var(--card-hover-shadow);
      background: var(--card-hover-background);
      outline: none;
      border-color: rgba(115, 135, 255, 0.45);
    }

    a.app-button span[aria-hidden="true"] {
      font-size: 1.5rem;
    }

    .app-links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    a.app-secondary,
    a.dev-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-radius: 999px;
      background: var(--dev-link-background);
      color: inherit;
      text-decoration: none;
      font-weight: 500;
      transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.12);
    }

    a.app-secondary:hover,
    a.app-secondary:focus-visible,
    a.dev-link:hover,
    a.dev-link:focus-visible {
      background: var(--dev-link-hover);
      transform: translateY(-2px);
      outline: none;
      box-shadow: 0 16px 34px rgba(15, 23, 42, 0.18);
    }

    a.app-secondary span[aria-hidden="true"],
    a.dev-link span[aria-hidden="true"] {
      font-size: 1.2rem;
    }

    section.dev-tools {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: clamp(18px, 3vw, 28px);
    }

    a.dev-link:focus-visible,
    a.app-button:focus-visible,
    a.app-secondary:focus-visible {
      box-shadow: 0 0 0 3px rgba(121, 134, 255, 0.35), inset 0 0 0 1px rgba(121, 134, 255, 0.6);
    }

    @media (max-width: 640px) {
      main {
        padding: clamp(12px, 4vw, 18px);
      }

      header.site-header h1 {
        font-size: clamp(1.6rem, 4vw + 1rem, 2.2rem);
      }
    }
  </style>
</head>
<body>
  <main aria-label="Apps">
    <ul class="apps">
      <li>
        <a class="app-button" href="apps/jokes/">
          <span aria-hidden="true">😂</span>
          <span class="app-label">Dad Jokes</span>
        </a>
        <div class="app-links" aria-label="Dad jokes extras">
          <a class="app-secondary" href="apps/jokes/all-jokes.html">
            <span aria-hidden="true">📚</span>
            <span>All Jokes</span>
          </a>
        </div>
      </li>
      <li>
        <a class="app-button" href="apps/quotes/">
          <span aria-hidden="true">💬</span>
          <span class="app-label">Quotes</span>
        </a>
        <div class="app-links" aria-label="Quote extras">
          <a class="app-secondary" href="apps/quotes/all-quotes.html">
            <span aria-hidden="true">🗂️</span>
            <span>All Quotes</span>
          </a>
        </div>
      </li>
      <li>
        <a class="app-button" href="apps/similarity-report/">
          <span aria-hidden="true">🧪</span>
          <span class="app-label">Cosine Similarity Lab</span>
        </a>
      </li>
    </ul>
    <section class="dev-tools" aria-label="Utility pages">
      <a class="dev-link" href="apps/value-formatter/">
        <span aria-hidden="true">🧮</span>
        <span>Value Formatter</span>
      </a>
    </section>
  </main>
</body>
</html>
