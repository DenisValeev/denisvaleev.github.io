<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toolbox Documentation</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      --page-background: linear-gradient(160deg, #eef2ff, #f8fafc 45%, #f4f6ff);
      --page-background-dark: linear-gradient(160deg, #020617, #0f172a 45%, #1e293b);
      --page-surface: rgba(255, 255, 255, 0.86);
      --page-surface-dark: rgba(15, 23, 42, 0.82);
      --panel-surface: rgba(255, 255, 255, 0.94);
      --panel-surface-dark: rgba(15, 23, 42, 0.88);
      --border-color: rgba(99, 102, 241, 0.2);
      --border-color-dark: rgba(148, 163, 209, 0.28);
      --shadow-color: rgba(15, 23, 42, 0.12);
      --shadow-color-dark: rgba(2, 6, 23, 0.6);
      --text-strong: #0f172a;
      --text-strong-dark: #e2e8f0;
      --text-muted: #475569;
      --text-muted-dark: rgba(203, 213, 225, 0.78);
      --accent: #4f46e5;
      --accent-dark: #818cf8;
      --accent-soft: rgba(79, 70, 229, 0.12);
      --accent-soft-dark: rgba(129, 140, 248, 0.16);
      --code-bg: rgba(15, 23, 42, 0.08);
      --code-bg-dark: rgba(15, 23, 42, 0.68);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page-background: var(--page-background-dark);
        --page-surface: var(--page-surface-dark);
        --panel-surface: var(--panel-surface-dark);
        --border-color: var(--border-color-dark);
        --shadow-color: var(--shadow-color-dark);
        --text-strong: var(--text-strong-dark);
        --text-muted: var(--text-muted-dark);
        --accent: var(--accent-dark);
        --accent-soft: var(--accent-soft-dark);
        --code-bg: var(--code-bg-dark);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: clamp(18px, 6vw, 56px);
      background: var(--page-background);
      color: var(--text-strong);
    }

    .doc-page {
      width: min(900px, 100%);
      display: flex;
      flex-direction: column;
      gap: clamp(20px, 3vw, 32px);
      background: var(--page-surface);
      border-radius: 28px;
      border: 1px solid var(--border-color);
      box-shadow: 0 30px 80px var(--shadow-color);
      padding: clamp(22px, 4vw, 36px);
      backdrop-filter: blur(10px);
    }

    header.doc-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: clamp(14px, 2vw, 24px);
    }

    .doc-title {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .doc-title h1 {
      margin: 0;
      font-size: clamp(2rem, 2vw + 1.6rem, 2.8rem);
      letter-spacing: -0.02em;
    }

    .doc-title p {
      margin: 0;
      color: var(--text-muted);
      font-size: clamp(1rem, 0.3vw + 0.95rem, 1.1rem);
      max-width: 60ch;
    }

    .home-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent);
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 0.01em;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .home-link:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(79, 70, 229, 0.28);
    }

    .home-link:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.55);
    }

    main.doc-main {
      display: flex;
      flex-direction: column;
      gap: clamp(20px, 3vw, 36px);
    }

    section.doc-content {
      background: var(--panel-surface);
      border-radius: 24px;
      border: 1px solid var(--border-color);
      padding: clamp(20px, 3vw, 32px);
      box-shadow: 0 26px 60px var(--shadow-color);
      display: flex;
      flex-direction: column;
      gap: 20px;
      min-height: 420px;
    }

    .doc-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .doc-progress {
      color: var(--text-muted);
      font-size: 0.9rem;
      flex: 1 1 180px;
      text-align: center;
    }

    .doc-nav-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid var(--border-color);
      background: rgba(79, 70, 229, 0.12);
      color: var(--accent);
      font-weight: 600;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    .doc-nav-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 24px rgba(79, 70, 229, 0.18);
      background: rgba(79, 70, 229, 0.18);
    }

    .doc-nav-button:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.45);
    }

    .doc-nav-button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
      background: rgba(148, 163, 209, 0.18);
      color: var(--text-muted);
    }

    header.content-meta {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    header.content-meta h2 {
      margin: 0;
      font-size: clamp(1.6rem, 1vw + 1.4rem, 2rem);
      letter-spacing: -0.015em;
    }

    header.content-meta p {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .doc-status {
      min-height: 1.4em;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    article.markdown-body {
      display: block;
      font-size: 1rem;
      line-height: 1.7;
      color: inherit;
    }

    article.markdown-body h1,
    article.markdown-body h2,
    article.markdown-body h3,
    article.markdown-body h4 {
      margin-top: 2.2em;
      margin-bottom: 0.8em;
      line-height: 1.3;
      letter-spacing: -0.01em;
    }

    article.markdown-body h1:first-child,
    article.markdown-body h2:first-child,
    article.markdown-body h3:first-child {
      margin-top: 0;
    }

    article.markdown-body p {
      margin: 0 0 1.1em;
    }

    article.markdown-body ul,
    article.markdown-body ol {
      padding-left: 1.4rem;
      margin: 0 0 1.1em;
    }

    article.markdown-body li + li {
      margin-top: 0.45em;
    }

    article.markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.8em 0;
      font-size: 0.95rem;
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.08);
    }

    article.markdown-body th,
    article.markdown-body td {
      border: 1px solid var(--border-color);
      padding: 10px 14px;
      text-align: left;
    }

    article.markdown-body th {
      background: rgba(79, 70, 229, 0.12);
      color: var(--accent);
    }

    article.markdown-body pre {
      background: var(--code-bg);
      border-radius: 14px;
      padding: 16px 20px;
      overflow-x: auto;
      margin: 1.6em 0;
      font-size: 0.95rem;
      border: 1px solid rgba(15, 23, 42, 0.08);
    }

    article.markdown-body code {
      font-family: "JetBrains Mono", "Fira Code", "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      background: var(--code-bg);
      padding: 2px 6px;
      border-radius: 6px;
    }

    article.markdown-body pre code {
      padding: 0;
      background: transparent;
    }

    @media (max-width: 1024px) {
      .doc-page {
        border-radius: 0;
        box-shadow: none;
        border: none;
      }

      .doc-progress {
        order: 3;
        flex-basis: 100%;
      }
    }

    @media (max-width: 720px) {
      body {
        padding: 0;
      }

      header.doc-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .home-link {
        align-self: stretch;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="doc-page">
    <header class="doc-header">
      <div class="doc-title">
        <h1>Toolbox knowledge base</h1>
        <p>Everything you need to keep the denisvaleev.github.io toolbox healthy. Browse the playbooks, workflows, and datasets that power the site.</p>
      </div>
      <a class="home-link" href="/" aria-label="Return to the toolbox home">⌂ Home</a>
    </header>
    <main class="doc-main">
      <section class="doc-content" aria-live="polite">
        <div class="doc-controls">
          <button type="button" class="doc-nav-button" data-doc-prev aria-label="View previous guide">← Previous</button>
          <p class="doc-progress" data-doc-progress aria-live="polite"></p>
          <button type="button" class="doc-nav-button" data-doc-next aria-label="View next guide">Next →</button>
        </div>
        <header class="content-meta">
          <h2 data-doc-title>Loading…</h2>
          <p data-doc-updated hidden></p>
        </header>
        <p class="doc-status" data-doc-status></p>
        <article class="markdown-body" data-doc-content>
          <p>Use the buttons above to browse the documentation guides.</p>
        </article>
      </section>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    (function () {
      const prevButton = document.querySelector('[data-doc-prev]');
      const nextButton = document.querySelector('[data-doc-next]');
      const progressEl = document.querySelector('[data-doc-progress]');
      const contentEl = document.querySelector('[data-doc-content]');
      const titleEl = document.querySelector('[data-doc-title]');
      const updatedEl = document.querySelector('[data-doc-updated]');
      const statusEl = document.querySelector('[data-doc-status]');

      if (!prevButton || !nextButton || !progressEl || !contentEl || !titleEl || !updatedEl || !statusEl) {
        return;
      }

      const guides = [
        { id: 'overview', title: 'Overview', file: 'docs/overview.md', summary: 'Start here' },
        { id: 'architecture', title: 'Site architecture', file: 'docs/architecture.md', summary: 'How the landing page, manifest, and worker interact' },
        { id: 'apps', title: 'App catalog', file: 'docs/apps.md', summary: 'Mini-app responsibilities and regressions' },
        { id: 'wiki-authoring', title: 'Wiki authoring', file: 'docs/wiki-authoring.md', summary: 'Front matter & commit logs' },
        { id: 'deploy-logs', title: 'Deploy logs', file: 'docs/deploy-logs.md', summary: 'Service worker navigation + Pages deploy log' },
        { id: 'data-maintenance', title: 'Data maintenance', file: 'docs/data-maintenance.md', summary: 'Datasets, manifests, and embeddings' },
        { id: 'testing-automation', title: 'Testing & automation', file: 'docs/testing-and-automation.md', summary: 'Playwright suite and CI workflows' },
        { id: 'development-guide', title: 'Development guide', file: 'docs/development-guide.md', summary: 'Coding conventions and contributor tasks' }
      ];

      const guideMap = new Map(guides.map((guide) => [guide.id, guide]));
      let activeGuideId = '';

      function updatePager(id) {
        const index = guides.findIndex((guide) => guide.id === id);
        const total = guides.length;
        if (index === -1) {
          prevButton.disabled = true;
          nextButton.disabled = true;
          prevButton.textContent = '← Previous';
          nextButton.textContent = 'Next →';
          prevButton.setAttribute('aria-label', 'Previous guide unavailable');
          nextButton.setAttribute('aria-label', 'Next guide unavailable');
          progressEl.textContent = total > 0 ? `0 of ${total}` : '';
          return;
        }

        const prevGuide = guides[index - 1];
        const nextGuide = guides[index + 1];

        if (prevGuide) {
          prevButton.disabled = false;
          prevButton.textContent = `← ${prevGuide.title}`;
          prevButton.setAttribute('aria-label', `View previous guide: ${prevGuide.title}`);
        } else {
          prevButton.disabled = true;
          prevButton.textContent = '← Previous';
          prevButton.setAttribute('aria-label', 'No previous guide');
        }

        if (nextGuide) {
          nextButton.disabled = false;
          nextButton.textContent = `${nextGuide.title} →`;
          nextButton.setAttribute('aria-label', `View next guide: ${nextGuide.title}`);
        } else {
          nextButton.disabled = true;
          nextButton.textContent = 'Next →';
          nextButton.setAttribute('aria-label', 'No next guide');
        }

        progressEl.textContent = `Guide ${index + 1} of ${total}`;
      }

      function formatUpdated(text) {
        if (!text) {
          return '';
        }
        try {
          const date = new Date(text);
          if (!Number.isNaN(date.getTime())) {
            return `Last updated ${date.toLocaleString()}`;
          }
        } catch (error) {
          return '';
        }
        return '';
      }

      async function loadGuide(id, options = {}) {
        const guide = guideMap.get(id) || guides[0];
        if (!guide) {
          return;
        }

        activeGuideId = guide.id;
        updatePager(activeGuideId);

        if (options.pushState) {
          window.history.pushState({ docId: guide.id }, '', `#${guide.id}`);
        } else if (window.location.hash.replace('#', '') !== guide.id) {
          window.history.replaceState({ docId: guide.id }, '', `#${guide.id}`);
        }

        statusEl.textContent = 'Loading…';
        updatedEl.hidden = true;
        updatedEl.textContent = '';

        try {
          const response = await fetch(guide.file, { cache: 'no-cache' });
          if (!response.ok) {
            throw new Error(`Failed to load ${guide.file}`);
          }

          const text = await response.text();
          const parsed = typeof marked !== 'undefined' && marked && typeof marked.parse === 'function'
            ? marked.parse(text)
            : text;

          contentEl.innerHTML = parsed;
          titleEl.textContent = guide.title;
          statusEl.textContent = '';

          updatePager(guide.id);

          const lastModified = response.headers.get('last-modified');
          const fallback = formatUpdated(lastModified);
          if (fallback) {
            updatedEl.textContent = fallback;
            updatedEl.hidden = false;
          } else {
            const nowLabel = `Loaded ${new Date().toLocaleString()}`;
            updatedEl.textContent = nowLabel;
            updatedEl.hidden = false;
          }
        } catch (error) {
          console.error(error);
          contentEl.innerHTML = '<p>Failed to load the requested guide. Please try again.</p>';
          titleEl.textContent = guide.title;
          statusEl.textContent = 'An error occurred while loading the guide.';
          updatePager(guide.id);
        }
      }

      function getInitialGuideId() {
        const hash = window.location.hash.replace('#', '').trim();
        if (hash && guideMap.has(hash)) {
          return hash;
        }
        const state = window.history.state;
        if (state && typeof state.docId === 'string' && guideMap.has(state.docId)) {
          return state.docId;
        }
        return guides[0] ? guides[0].id : '';
      }

      window.addEventListener('popstate', (event) => {
        const state = event.state;
        if (state && state.docId && guideMap.has(state.docId)) {
          loadGuide(state.docId, { pushState: false });
        } else {
          const fallbackId = getInitialGuideId();
          if (fallbackId) {
            loadGuide(fallbackId, { pushState: false });
          }
        }
      });

      prevButton.addEventListener('click', () => {
        const index = guides.findIndex((guide) => guide.id === activeGuideId);
        if (index > 0) {
          loadGuide(guides[index - 1].id, { pushState: true });
        }
      });

      nextButton.addEventListener('click', () => {
        const index = guides.findIndex((guide) => guide.id === activeGuideId);
        if (index !== -1 && index < guides.length - 1) {
          loadGuide(guides[index + 1].id, { pushState: true });
        }
      });

      const initialId = getInitialGuideId();
      if (initialId) {
        loadGuide(initialId, { pushState: false });
      } else if (guides[0]) {
        loadGuide(guides[0].id, { pushState: false });
      }
    })();
  </script>
</body>
</html>
